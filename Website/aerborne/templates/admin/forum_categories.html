{% extends "admin/base.html" %}
{% block title %}Forum categories{% endblock %}
{% block content %}
<h1>Forum categories</h1>
{% for c in rows %}
<form class="card cat-form" method="post">
  <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
  <input type="hidden" name="id" value="{{ c.id }}">
  <div class="cat-grid">
    <label>Name <input name="name" value="{{ c.name }}" required maxlength="60"></label>
    <label>Slug <input name="slug" value="{{ c.slug }}" required maxlength="40" pattern="[a-z0-9]+(-[a-z0-9]+)*"></label>
    <label>Order <input name="sort_order" value="{{ c.sort_order }}" inputmode="numeric"></label>
  </div>
  <label>Description <input name="description" value="{{ c.description }}" maxlength="200"></label>
  <label class="check"><input type="checkbox" name="staff_only" value="1"{% if c.staff_only %} checked{% endif %}> Only the Aerborne team can start threads</label>
  <p class="fine">{{ c.threads }} thread{{ '' if c.threads == 1 else 's' }}</p>
  <button class="btn btn-quiet" type="submit">Save</button>
</form>
{% endfor %}
<h2>Add a category</h2>
<form class="card cat-form" method="post">
  <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
  <div class="cat-grid">
    <label>Name <input name="name" required maxlength="60"></label>
    <label>Slug <input name="slug" required maxlength="40" pattern="[a-z0-9]+(-[a-z0-9]+)*"></label>
    <label>Order <input name="sort_order" value="{{ rows | length }}" inputmode="numeric"></label>
  </div>
  <label>Description <input name="description" maxlength="200"></label>
  <label class="check"><input type="checkbox" name="staff_only" value="1"> Only the Aerborne team can start threads</label>
  <button class="btn" type="submit">Add category</button>
</form>
{% endblock %}
