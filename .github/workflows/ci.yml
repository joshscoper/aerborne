name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew --no-daemon clean qualityGate build
      - uses: actions/upload-artifact@v4
        with:
          name: nerdsmp-plugins
          path: |
            nerdsmp-paper/build/libs/*.jar
            nerdsmp-edge/build/libs/*.jar

