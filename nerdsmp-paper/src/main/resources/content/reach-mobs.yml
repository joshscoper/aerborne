# Creatures of the Wardens' Reach (docs/vault/60 Bestiary/Bestiary.md). Ships inside the plugin, so updates
# bring new ones automatically; an entry with the same id in content/mobs.yml overrides it.
# Same keys as content/world-mobs.yml. Zone spawners take the normal ones; elites (rares and the Scarecrow King)
# are placed by the Reach's encounter spots with their own respawn timers.
mobs:
  # ------------------------------------------------------------------ Goldenreach Vale (levels 1-7)
  # Wildlife and the walking scarecrows reuse field_gnawer, bristle_boar and straw_scarecrow from world-mobs.yml.
  tollkeeper_cutthroat:
    rank: normal
    name: "<#c0392b>Tollkeeper Cutthroat</#c0392b>"
    type: vindicator
    health: 24
    attack-damage: 3
    ability: none
    mark-reward: 2
    hunting-experience: 18
    equipment: {head: leather_helmet, chest: leather_chestplate, hand: stone_axe}
