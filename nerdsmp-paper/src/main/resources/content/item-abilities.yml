# What rarer gear can do. `abilities` binds ability ids to item ids, so an item's ability can change
# here without touching a server's edited relics.yml. `items` adds gear that the catalog doesn't list yet;
# an entry a server has defined in relics.yml keeps that server's version. Ability ids are in ItemAbility.java.
abilities:
  # The Hollow Barrow.
  ossuary_cleaver: [bone_shards]
  wardens_soulblade: [soul_siphon, soul_nova]
  gravewall_bulwark: [last_stand]
