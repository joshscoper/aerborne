schema: 2

# Vanilla survival drops remain authoritative. These narrow rules trim only repeatable junk.
vanilla-adjustments:
  undead-remains:
    entities: [ZOMBIE, HUSK, DROWNED, ZOMBIE_VILLAGER, CAMEL_HUSK, ZOMBIE_NAUTILUS, ZOGLIN]
    items:
      ROTTEN_FLESH:
        keep-chance: 0.45
        maximum: 1
  piglin-remains:
    entities: [ZOMBIFIED_PIGLIN]
    items:
      ROTTEN_FLESH:
        keep-chance: 0.30
        maximum: 1
  witch-junk:
    entities: [WITCH]
    items:
      STICK:
        keep-chance: 0.0
        maximum: 0

# Every player-killed hostile can roll sealed gear. Entity pools keep finds thematically coherent.
hostile-gear:
  standard:
    chance: 0.008
    minimum-affixes: 1
    maximum-affixes: 2
    rolls: 1
  elite:
    chance: 0.10
    minimum-affixes: 2
    maximum-affixes: 3
    rolls: 1
  boss:
    chance: 1.0
    minimum-affixes: 2
    maximum-affixes: 3
    rolls: 2
  default-items: [ironroot_blade, ironroot_pickaxe, ironroot_helm, ironroot_plate, ironroot_boots,
    wildwood_axe, wildwood_sickle, wildwood_hood, wildwood_coat, wildwood_boots,
    riftglass_edge, riftglass_pickaxe, riftglass_visor, riftglass_cuirass, riftglass_boots]
  pools:
    undead:
      entities: [ZOMBIE, HUSK, DROWNED, ZOMBIE_VILLAGER, CAMEL_HUSK, ZOMBIE_NAUTILUS, ZOGLIN]
      items: [hollowfang_blade, hollowfang_mask, hollowfang_coat,
        ironroot_blade, ironroot_helm, ironroot_plate, ironroot_boots]
    bonebound:
      entities: [SKELETON, STRAY, BOGGED, PARCHED, WITHER_SKELETON]
      items: [hollowfang_blade, hollowfang_mask, hollowfang_coat,
        starfall_focus, starfall_circlet, starfall_boots]
    wild:
      entities: [SPIDER, CAVE_SPIDER, SILVERFISH, CREEPER, SLIME, PHANTOM, CREAKING]
      items: [wildwood_axe, wildwood_sickle, wildwood_hood, wildwood_coat, wildwood_boots,
        verdant_sickle, verdant_crown, verdant_raiment]
    raiders:
      entities: [PILLAGER, VINDICATOR, EVOKER, ILLUSIONER, RAVAGER, VEX, WITCH]
      items: [ironroot_blade, ironroot_helm, ironroot_plate, ironroot_boots,
        hollowfang_blade, hollowfang_mask, hollowfang_coat]
    nether:
      entities: [BLAZE, GHAST, MAGMA_CUBE, SULFUR_CUBE, HOGLIN, PIGLIN, PIGLIN_BRUTE, ZOMBIFIED_PIGLIN, WITHER]
      items: [emberforged_pickaxe, emberforged_mantle, emberforged_greaves,
        riftglass_edge, riftglass_visor, riftglass_cuirass, riftglass_boots]
    end:
      entities: [ENDERMAN, ENDERMITE, SHULKER, ENDER_DRAGON]
      items: [riftglass_edge, riftglass_pickaxe, riftglass_visor, riftglass_cuirass, riftglass_boots,
        starfall_focus, starfall_circlet, starfall_boots, veilwalker_compass, veilwalker_hood, veilwalker_boots]
    ocean:
      entities: [GUARDIAN, ELDER_GUARDIAN]
      items: [tideglass_rod, tideglass_coat, tideglass_boots,
        verdant_sickle, verdant_crown, verdant_raiment]
    ancient:
      entities: [WARDEN, BREEZE]
      items: [starfall_focus, starfall_circlet, starfall_boots,
        veilwalker_compass, veilwalker_hood, veilwalker_boots]

# Purses are physical, account-safe currency drops. Pickup credits the immutable economy ledger.
coin-purses:
  standard:
    chance: 0.20
    min-marks: 1
    max-marks: 4
  elite:
    chance: 1.0
    min-marks: 12
    max-marks: 20
  boss:
    chance: 1.0
    min-marks: 75
    max-marks: 125

custom-loot:
  chest:
    chance: 0.08
    unidentified-chance: 0.35
    minimum-affixes: 1
    maximum-affixes: 3
    items: [ironroot_blade, ironroot_pickaxe, ironroot_helm, ironroot_plate, ironroot_boots,
      wildwood_axe, wildwood_sickle, wildwood_hood, wildwood_coat, wildwood_boots,
      riftglass_edge, riftglass_pickaxe, riftglass_visor, riftglass_cuirass, riftglass_boots]

# Supplemental player-kill rolls. Base drops such as food, pearls, rods, skulls, shells, and
# progression items remain intact unless explicitly listed in vanilla-adjustments above.
