    gear: [barrowguard_helm, barrowguard_cuirass, barrowguard_greaves, barrowguard_boots, sextons_edge]
    signatures: [huntsmans_longbow]
    finds: [pallbearers_buckler, sextons_rosary, gravecloth_mantle, processional_shroud, ossuary_wraps, diggers_gloves, bonetie_belt, funeral_band, vigil_stub]
    bosses:
      wardens_hall: [gatewardens_pauldrons, wardens_girdle, ossuary_cleaver, gravewall_bulwark, ribcage_hauberk, south_gate_key, wardens_soulblade]
