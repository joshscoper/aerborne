# Expedition loot: each expedition's materials (common, uncommon, rare), signature set pieces
# and boss signatures. `bosses` lists what each boss room can give from its chest, likeliest first, and
# `finds` is gear for the slots a set doesn't cover: it drops wherever set pieces do, but can't be forged.
# Ships inside the plugin; a server can override an expedition here by copying its entry into the
# data folder's content/expedition-loot.yml.
expeditions:
  first_flight:
    materials: [skyward_feather]
  hollow_barrow:
    materials: [grave_dust, barrow_wax, huntsmans_antler]
    gear: [barrowguard_helm, barrowguard_cuirass, barrowguard_greaves, barrowguard_boots, sextons_edge]
    signatures: [huntsmans_longbow]
    finds: [pallbearers_buckler, sextons_rosary, gravecloth_mantle, processional_shroud, ossuary_wraps, diggers_gloves, bonetie_belt, funeral_band, vigil_stub]
    bosses:
      wardens_hall: [gatewardens_pauldrons, wardens_girdle, ossuary_cleaver, gravewall_bulwark, ribcage_hauberk, south_gate_key, wardens_soulblade]
      widows_cell: [widows_wristlets, weeping_shawl, funeral_skirts, keening_dirk, widows_band, mourning_veil, locket_of_the_last_letter, widows_requiem]
      kings_rest: [ember_scarred_gauntlets, ashen_tassets, hill_road_treads, pyrebound_signet, horn_of_the_last_cart, hollow_crown, pyre_greatsword, huntsmans_longbow]
  thornwood_canopy:
    materials: [briar_silk, thornheart_sap, matrons_fang]
    gear: [thornwarden_hood, thornwarden_jerkin, thornwarden_leggings, thornwarden_boots, briarshot_crossbow]
    signatures: [thornheart_rapier]
    finds: [rangers_roundel, acorn_cord, bark_spaulders, mossweave_cloak, vine_wraps, climbers_grips, rangers_sash, bramble_loop, ember_touched_acorn]
    bosses:
      matrons_nest: [silk_wrapped_bracers, spinneret_gloves, silkstrand_shawl, fang_of_the_matron, broodmothers_carapace, venomglass_vial, matrons_eye_pendant]
      verrins_perch: [wind_cut_mantle, waywatcher_belt, rangers_oath_band, last_watch_hood, windward_boots, briarshot_crossbow, verrins_watchbow]
      heart_grove: [rootbound_greaves, barkskin_helm, emberrot_buckler, heartwood_band, heart_seed, thornheart_cuirass, thornheart_rapier]
  sunken_aqueduct:
    materials: [tidepearl, sluice_cog, tidewardens_scale]
    gear: [tidebound_helm, tidebound_cuirass, tidebound_greaves, tidebound_boots, sluicebreaker_trident]
    signatures: [tidewardens_trident]
  gloomforge_mines:
    materials: [gloomsteel_ore, blasting_powder, foremans_lamp]
    gear: [gloomforged_helm, gloomforged_plate, gloomforged_greaves, gloomforged_boots, gloomforged_pick]
    signatures: [deep_foremans_pick]
  hall_of_wardens:
    materials: [sigil_shard, wardens_seal, archive_key]
    gear: [wardensworn_helm, wardensworn_plate, wardensworn_greaves, wardensworn_boots, tri_seal_blade]
    signatures: [wardens_aegis]
  cinder_keep:
    materials: [cinder_shard, smoldering_core, sovereigns_ember]
    gear: [kilnborn_crown, kilnborn_cuirass, kilnborn_greaves, kilnborn_sabatons, kilnbreaker_maul]
    signatures: [sovereigns_hammer, crown_of_embers, steward_ashkars_mantle]
