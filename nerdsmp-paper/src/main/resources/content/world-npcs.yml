    description: Seeds, saplings and bone meal grown in the Lanternmere Gardens for island planters.
    products:
      oak_sapling:
        material: OAK_SAPLING
        amount: 2
        buy-price: 20
        sell-price: 0
        daily-sell-limit: 0
        minimum-reputation: -249
        description: Hardy starter trees.
      cherry_sapling:
        material: CHERRY_SAPLING
        amount: 1
        buy-price: 45
        sell-price: 0
        daily-sell-limit: 0
        minimum-reputation: 0
        description: Grown from the orchards around Highcrown.
      bone_meal:
        material: BONE_MEAL
        amount: 8
        buy-price: 24
        sell-price: 0
