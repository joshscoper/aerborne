dialogues:
  aldric_start:
    text:
      - "Welcome to Highcrown, {player}. The keep, the town and the isles beyond are all yours to explore."
      - "Every road out of these walls is short of hands. Shall I put you to work?"
    choices:
      quests:
        text: "What needs doing?"
        effects:
          - type: open_quests
      isles:
        text: "Tell me about the Highcrown Isles."
        next: aldric_isles
      journal:
        text: "Show my quest journal."
        effects:
          - type: open_command
            command: journal
      done:
        text: "Later, Steward."
        close: true
  aldric_isles:
    text:
      - "West lie the Goldenreach farms and the Wildwood. North, the Gloomroot pines and the druids' hollow."
      - "South, the Sunscar canyons and their gold mine, then the Amberdune and Sandmere's bazaar. Beyond them all, ice and storm peaks."
    choices:
      quests:
        text: "Where should a newcomer start?"
        effects:
          - type: open_quests
      back:
        text: "I had another question."
        next: aldric_start
      done:
        text: "Thank you."
        close: true

  corwin_start:
    text:
      - "Feet apart. Shield up. Nobody survives the Wildwood by swinging wildly."
      - "I train every recruit who passes through this courtyard."
    choices:
      quests:
        text: "Train me."
        effects:
          - type: open_quests
      skills:
        text: "How are my skills coming along?"
        effects:
          - type: open_command
            command: skills
      mastery:
        text: "I want to master a discipline."
        effects:
          - type: open_command
            command: mastery
      done:
        text: "Another time."
        close: true

  brenna_start:
    text:
      - "The Watch keeps the roads, {player}. Lately the roads keep us busy."
      - "Brigands on the Kingsroad, beasts in the pines. I could use a capable blade."
    choices:
      quests:
        text: "Put me on patrol."
        effects:
          - type: open_quests
      contracts:
        text: "Any Warden contracts?"
        effects:
          - type: open_contracts
      done:
        text: "Stay sharp, Captain."
        close: true

  wynn_start:
    text:
      - "Ships call at Gullwater whenever the weather lets them. The pines along the north shore bring trouble down to the docks."
    choices:
      quests:
        text: "Need a hand on the docks?"
        effects:
          - type: open_quests
      warps:
        text: "Where can I travel from here?"
        effects:
          - type: open_command
            command: warps
      fishing:
        text: "How is the fishing?"
        effects:
          - type: open_command
            command: fishing
      done:
        text: "Fair winds."
        close: true

  liss_start:
    text:
      - "Mind the lanterns, they took me a whole summer. What brings you to the gardens?"
    choices:
      quests:
        text: "Can I help with the gardens?"
        effects:
          - type: open_quests
      shop:
        text: "What are you growing for sale?"
        effects:
          - type: open_shop
            shop: herbalist_wares
      done:
        text: "Just admiring the flowers."
        close: true

  odo_start:
    text:
      - "Goldenreach has fed Highcrown for three generations. This year the fields are eating us instead."
      - "Gnawers in the wheat, boars at the fences, and the scarecrows... don't ask about the scarecrows."
    choices:
      quests:
        text: "I'll help with the fields."
        effects:
          - type: open_quests
      farming:
        text: "Any farming advice?"
        next: odo_advice
      done:
        text: "Good luck with the harvest."
        close: true
  odo_advice:
    text:
      - "Plant on your own island and keep the soil watered. A good hoe harvests and replants in one go."
      - "Bring surplus wheat to Alba in the market. She pays fair."
    choices:
      back:
        text: "About those pests..."
        next: odo_start
      done:
        text: "Thanks, Odo."
        close: true

  garet_start:
    text:
      - "This crossroads is the heart of the Kingsroad. East to Highcrown, west to the meadows, south to the canyons."
      - "Brigands think the hedges hide them. They don't hide them from me."
    choices:
      quests:
        text: "Point me at the brigands."
        effects:
          - type: open_quests
      roads:
        text: "Where do the roads lead?"
        next: garet_roads
      done:
        text: "Safe roads, Waywarden."
        close: true
  garet_roads:
    text:
      - "The western road runs past Mossfall to the meadows and the glacier. The southern road drops into the Sunscar canyons and on to the dunes."
    choices:
      back:
        text: "Back to business."
        next: garet_start
      done:
        text: "Understood."
        close: true

  ilsa_start:
    text:
      - "Quiet. Hear that? The wolfhounds have been circling the lumber camp for a week."
    choices:
      quests:
        text: "I can hunt."
        effects:
          - type: open_quests
      gloomroot:
        text: "What's out in the Gloomroot?"
        next: ilsa_lore
      done:
        text: "I'll leave you to it."
        close: true
  ilsa_lore:
    text:
      - "Old pines, older webs. The druids keep a hollow in the middle of it all. Elder Moss knows the forest better than anyone."
    choices:
      back:
        text: "About the wolfhounds..."
        next: ilsa_start
      done:
        text: "Thanks."
        close: true

  moss_start:
    text:
      - "The Ward is a quiet place, traveller. The forest around it is not."
      - "The weavers and the thorned watchers have grown bold. The grove needs tending."
    choices:
      quests:
        text: "How can I help the grove?"
        effects:
          - type: open_quests
      excavation:
        text: "What can be found in this soil?"
        effects:
          - type: open_command
            command: excavation
      dig:
        text: "Where can I dig?"
        effects:
          - type: open_command
            command: digsite
      done:
        text: "Peace be with the grove."
        close: true

  imre_start:
    text:
      - "Mossfall was a temple once. Now it hums at night and the dead walk its stairs."
      - "Science demands that someone go and look. Preferably someone else."
    choices:
      quests:
        text: "I'll be your someone."
        effects:
          - type: open_quests
      archive:
        text: "I brought finds for the archive."
        effects:
          - type: open_archive
      done:
        text: "Good luck with the research."
        close: true

  tobin_start:
    text:
      - "Tobin's the name, travelling's the game. The road's been unkind lately: brigands took half my stock."
    choices:
      quests:
        text: "Need help on the road?"
        effects:
          - type: open_quests
      news:
        text: "Heard any news?"
        next: tobin_news
      done:
        text: "Safe travels, Tobin."
        close: true
  tobin_news:
    text:
      - "Ice wolves past the glacier road, sand-scorpions near Sandmere, and gold, real gold, in the Sunscar canyons. Ask for Magda Hale."
    choices:
      back:
        text: "Anything else?"
        next: tobin_start
      done:
        text: "Thanks for the tip."
        close: true

  dren_start:
    text:
      - "From this ridge I can see every canyon in the Sunscar. Lately I can see too many raiders in them."
    choices:
      quests:
        text: "I'll clear the canyons."
        effects:
          - type: open_quests
      mine:
        text: "What's in the middle of the canyons?"
        next: dren_mine
      done:
        text: "Keep watching."
        close: true
  dren_mine:
    text:
      - "The Gilded Hollow, an open pit with gold in every wall. Magda Hale runs it from the southern rim."
    choices:
      back:
        text: "About those raiders..."
        next: dren_start
      done:
        text: "I'll pay her a visit."
        close: true

  hale_start:
    text:
      - "Mind the edge, it's a long way down. The Gilded Hollow's walls are thick with gold, and the veins grow back faster than you'd believe."
    choices:
      quests:
        text: "I'm here to work."
        effects:
          - type: open_quests
      veins:
        text: "Gold that grows back?"
        next: hale_veins
      done:
        text: "Maybe later."
        close: true
  hale_veins:
    text:
      - "Mine any ore in the pit and the vein closes up again after a short while. Something in the deep rock. Nobody's complaining."
      - "Mind the lurkers in the tunnels, and the Overseer. He thinks he owns the place."
    choices:
      back:
        text: "Put me to work."
        next: hale_start
      done:
        text: "Noted."
        close: true

  samar_start:
    text:
      - "Peace be upon you, {player}. Sandmere welcomes every traveller with coin, and many without."
      - "The dunes test my caravans. Perhaps you can test the dunes."
    choices:
      quests:
        text: "What troubles Sandmere?"
        effects:
          - type: open_quests
      bazaar:
        text: "Tell me about the bazaar."
        next: samar_bazaar
      done:
        text: "Farewell, Merchant-Prince."
        close: true
  samar_bazaar:
    text:
      - "Kasim trades in the stalls, Nadira keeps the oasis and its buried secrets, and Tavros runs the colosseum on the southern shore."
    choices:
      back:
        text: "About those troubles..."
        next: samar_start
      done:
        text: "Thank you."
        close: true

  kasim_start:
    text:
      - "Cactus, sandstone, desert honey! Everything a dune-walker needs, nothing they don't."
    choices:
      shop:
        text: "Show me your wares."
        effects:
          - type: open_shop
            shop: bazaar_wares
      quests:
        text: "Any work?"
