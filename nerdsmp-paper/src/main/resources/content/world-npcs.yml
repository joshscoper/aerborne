# NPCs of the Highcrown Isles, the shared spawn map (see worldpacks/highcrown.yml, which places them).
# This file ships inside the plugin, so updates bring new lines automatically. A server's own
# content/npcs.yml wins for any id it also defines. Same format as content/npcs.yml; factions come from there.
# Quest givers open their quest board with the open_quests effect; quests live in content/world-quests.yml.

