# Refine expedition materials in a furnace or blast furnace. Blasting takes half the listed time.
# Craft alloys and equipment at a crafting table; item: ingredients require that exact custom item.
schema-version: 2
smelting:
  gloomsteel:
    input: gloomsteel_ore
    smithing-xp: 10
    result: gloomsteel_ingot
    ticks: 200
    experience: 0.7
  bindingsteel:
    input: sovereign_ash
    smithing-xp: 24
    result: bindingsteel_ingot
    ticks: 320
    experience: 1.5
  cindersteel:
    input: cinder_shard
    smithing-xp: 16
    result: cindersteel_ingot
    ticks: 240
    experience: 1.0
  tideglass:
    input: tidepearl
    smithing-xp: 8
    result: tideglass
    ticks: 200
    experience: 0.7
  tempered_sigil:
    input: sigil_shard
    smithing-xp: 12
    result: tempered_sigil
    ticks: 240
    experience: 1.0
  briar_resin:
    input: thornheart_sap
    smithing-xp: 6
    result: briar_resin
    ticks: 160
    experience: 0.5
