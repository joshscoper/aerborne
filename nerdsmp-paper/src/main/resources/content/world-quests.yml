  daily_scorpion_bounty:
    chain: daily_bounties
    title: Scorpion Bounty
    giver: samar_vizier
    level: 8
    repeat: daily
    requires: [scorpions_at_the_well]
    offer:
      - "The wells are crawling again. My caravans leave at dawn; clear the way and I pay the bounty."
    complete:
      - "The caravans thank you. My purse, less so, but a bounty is a bounty."
    objectives:
      - {type: kill, targets: ["custom:dune_scorpion"], count: 10, description: Defeat Dune Scorpions in the Amberdune}
    rewards:
      marks: 110
      xp: {hunting: 400}
      reputation: {free_delvers: 5}

  daily_arena_bouts:
    chain: daily_bounties
    title: Arena Bouts
    giver: arena_master_tavros
    level: 8
    repeat: daily
    requires: [trial_of_the_sands]
    offer:
      - "The crowd wants blood. Well, it wants a good show. Win five bouts and I'll pay you like a star."
    complete:
      - "Hear them cheer! Come back tomorrow, they'll want you again."
    objectives:
      - {type: kill, targets: ["custom:arena_gladiator"], zone: sunscorch_colosseum, count: 5, description: Win five bouts against Pit Gladiators}
    rewards:
      marks: 130
      xp: {hunting: 450}

  daily_frostwatch_sweep:
    chain: daily_bounties
    title: Frostwatch Sweep
    giver: warden_halvard
    level: 8
    repeat: daily
    requires: [into_the_frostveil]
    offer:
      - "The frost-marked walk the glacier's edge every night. Sweep them back before the next watch."
    complete:
      - "The edge holds another day. Get warm, then come back tomorrow."
    objectives:
      - {type: kill, targets: ["custom:frostmarked"], zone: frostveil_glacier, count: 8, description: Defeat the Frostmarked on the glacier}
    rewards:
      marks: 150
      xp: {hunting: 550}
      reputation: {frontier_wardens: 5}
