  daily_ore_quota:
    chain: daily_bounties
    title: Daily Ore Quota
    giver: prospector_hale
    level: 6
    repeat: daily
    requires: [gold_fever]
    offer:
      - "The buyers want their gold by sundown. Fill the quota and the share's yours."
    complete:
      - "Quota met. Same again tomorrow, the buyers are never full."
    objectives:
      - {type: harvest, targets: [GOLD_ORE], zone: gilded_hollow, count: 16, description: Mine gold ore in the Gilded Hollow}
    rewards:
      marks: 90
