  daily_oasis_survey:
    chain: daily_bounties
    title: Oasis Survey
    giver: nadira_oasis
    level: 6
    repeat: daily
    requires: [the_oasis_finds]
    offer:
      - "The sand settles back every night and buries new finds near the surface. Dig the banks again?"
    complete:
      - "Two more shards for the archive. The old city is patient, and so am I."
    objectives:
      - {type: dig, targets: [SAND], zone: sandmere, count: 15, description: Dig the sand around the oasis}
    rewards:
      marks: 80
      xp: {excavation: 320}
