schema-version: 11

factions:
  frontier_wardens:
    name: Frontier Wardens
    description: Road crews, watch captains, and quartermasters keeping the frontier connected.
    tiers:
      hostile:
        name: Wanted
        color: red
        threshold: -1000
        shop-price-multiplier: 1.35
        can-trade: false
      distrusted:
        name: Watched
        color: dark_red
        threshold: -249
        shop-price-multiplier: 1.15
        can-trade: true
      neutral:
        name: Unknown
        color: gray
        threshold: 0
        shop-price-multiplier: 1.00
        can-trade: true
      trusted:
        name: Trailhand
        color: green
        threshold: 250
        shop-price-multiplier: 0.90
        can-trade: true
      honored:
        name: Lantern-Bearer
        color: gold
        threshold: 600
        shop-price-multiplier: 0.80
        can-trade: true

  rift_scholars:
    name: Rift Scholars
    description: Field researchers who catalogue relics, strange weather, and unstable crossings.
    tiers:
      hostile:
        name: Banned
        color: red
        threshold: -1000
        shop-price-multiplier: 1.40
        can-trade: false
      distrusted:
        name: Questionable
        color: dark_red
        threshold: -249
        shop-price-multiplier: 1.20
        can-trade: true
      neutral:
        name: Unreviewed
        color: gray
        threshold: 0
        shop-price-multiplier: 1.00
        can-trade: true
      trusted:
        name: Field Assistant
        color: aqua
        threshold: 250
        shop-price-multiplier: 0.90
        can-trade: true
      honored:
        name: Riftwise
        color: light_purple
        threshold: 600
        shop-price-multiplier: 0.78
        can-trade: true

  free_delvers:
    name: Free Delvers
    description: Independent explorers who trade routes, salvage, and hard-earned warnings.
    tiers:
      hostile:
        name: Blacklisted
        color: red
        threshold: -1000
        shop-price-multiplier: 1.30
        can-trade: false
      distrusted:
        name: Bad Company
        color: dark_red
        threshold: -249
        shop-price-multiplier: 1.15
        can-trade: true
      neutral:
        name: New Face
        color: gray
        threshold: 0
        shop-price-multiplier: 1.00
        can-trade: true
      trusted:
        name: Route-Mate
        color: green
        threshold: 250
        shop-price-multiplier: 0.88
        can-trade: true
      honored:
        name: Deepwalker
        color: gold
        threshold: 600
        shop-price-multiplier: 0.76
        can-trade: true

