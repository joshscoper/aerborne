# NPCs of the Wardens' Reach (docs/vault/40 NPCs/NPC Roster.md), placed by the Reach's world pack (built in code
# from the generator's spots, see net.nerdsmp.paper.reach.ReachPack). Ships inside the plugin; a server's own
# content/npcs.yml wins for any id it also defines. Same format as content/world-npcs.yml.
# Quest givers get an automatic "[!] Quests" reply; their quests live in content/reach-quests.yml.

# No shops of their own yet: skiff masters and the innkeeper use the existing services.
shops: {}

