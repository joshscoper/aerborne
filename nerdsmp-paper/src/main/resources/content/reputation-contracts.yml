schema-version: 2

contracts:
  warden_story_missing_lanterns:
    faction: frontier_wardens
    cadence: story
    chapter: I
    title: The Missing Lanterns
    description: Mara's road lanterns are vanishing. Cut fresh timber so the Wardens can replace the posts and mark the theft sites.
    action: chop_log
    target: 24
    reputation: 25
    marks: 100
    minimum-adventurer-level: 1
  warden_story_road_in_red:
    faction: frontier_wardens
    cadence: story
    chapter: II
    prerequisite: warden_story_missing_lanterns
    title: A Road Marked Red
    description: The broken posts point toward an organized hostile camp. Clear the route before the next caravan leaves the city.
    action: slay_monster
    target: 30
    reputation: 40
    marks: 200
    minimum-adventurer-level: 5
  warden_story_last_bridge:
    faction: frontier_wardens
    cadence: story
    chapter: III
    prerequisite: warden_story_road_in_red
    title: The Last Bridge
    description: With the road reclaimed, craft the fittings and field supplies needed to reopen its final bridge.
    action: craft_item
    target: 96
    reputation: 75
    marks: 400
    minimum-adventurer-level: 10

  scholar_story_silent_shard:
    faction: rift_scholars
    cadence: story
    chapter: I
    title: The Silent Shard
    description: Lyra found a shard that absorbs nearby sound. Mine fresh samples so the archive can learn what woke it.
    action: mine_ore
    target: 20
    reputation: 25
    marks: 100
    minimum-adventurer-level: 1
  scholar_story_echo_pattern:
    faction: rift_scholars
    cadence: story
    chapter: II
    prerequisite: scholar_story_silent_shard
    title: Pattern in the Echo
    description: The samples resonate in sequence. Craft field instruments so Elian can map where the pattern converges.
    action: craft_item
    target: 48
    reputation: 40
    marks: 200
    minimum-adventurer-level: 5
  scholar_story_thin_place:
    faction: rift_scholars
    cadence: story
    chapter: III
    prerequisite: scholar_story_echo_pattern
    title: The Thin Place
    description: The pattern ends beneath an unstable crossing. Gather a final mineral survey before the seal is disturbed.
    action: mine_ore
    target: 120
    reputation: 75
    marks: 400
    minimum-adventurer-level: 10

  delver_story_empty_net:
    faction: free_delvers
    cadence: story
    chapter: I
    title: An Empty Net
    description: Garrick's river camp stopped sending provisions. Catch fresh fish while the Delvers trace the abandoned route.
    action: catch_fish
    target: 8
    reputation: 25
    marks: 100
    minimum-adventurer-level: 1
  delver_story_tracks_downriver:
    faction: free_delvers
    cadence: story
    chapter: II
    prerequisite: delver_story_empty_net
    title: Tracks Downriver
    description: The missing crew fled something large enough to empty the banks. Clear hostile ground along their trail.
    action: slay_monster
    target: 35
    reputation: 40
    marks: 200
    minimum-adventurer-level: 5
  delver_story_way_home:
    faction: free_delvers
    cadence: story
    chapter: III
    prerequisite: delver_story_tracks_downriver
    title: A Way Home
    description: The crew is alive but stranded. Land enough provisions for the rescue party and the journey back.
    action: catch_fish
    target: 60
    reputation: 75
    marks: 400
    minimum-adventurer-level: 10

  warden_road_watch:
