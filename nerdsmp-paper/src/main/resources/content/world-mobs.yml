# Creatures of the Highcrown Isles, the shared spawn map (see worldpacks/highcrown.yml). This file ships
# inside the plugin, so updates bring new ones automatically. To change one on your server, copy its entry
# into content/mobs.yml: an entry there with the same id overrides this file.
#
# Same keys as content/expedition-mobs.yml. Zone spawners only accept ordinary ground creatures, so none of
# these is a boss. Rank is explicit: the Overseer and Champion are elites; ordinary foes are normal.
# hunting-experience optionally overrides RPG skill XP only; vanilla orb drops remain independent.
mobs:
