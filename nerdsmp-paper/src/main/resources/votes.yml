# Voting on server list sites. Restart the server after changing this file.
#
# Sites tell the server about each vote through Votifier, the protocol NuVotifier speaks (v1 and v2).
# On a site's page for the server, fill in:
#   Address  the server's public address (its IP or domain, without a port)
#   Port     listener.port below. It has to be reachable from the internet; on a host like
#            BisectHosting, use an extra port they give you and put that number here.
#   Token    the text in security/votifier-token.txt (Votifier v2; use this where a site takes it)
#   or Public key: the text in security/votifier/public.key (Votifier v1, for sites without tokens)
# Then use the site's "test" button and check /nerdadmin vote.
listener:
  enabled: true
  host: 0.0.0.0
  port: 9027

rewards:
  marks-per-vote: 100
  # A vote on the day after your last one adds this, for up to streak-cap-days days in a row.
  streak-bonus-marks: 10
  streak-cap-days: 7
  # Every this many votes earns an XP booster. 0 turns it off.
  booster-every: 20
  # The same site sending the same player again within this many hours is a repeat and pays nothing.
  repeat-hours: 6
  # At most this many paid votes per player in a day, whatever the sites send.
  max-paid-per-day: 8
  # Each different site voted on in the same day pays this much more than the one before:
  # with the defaults the first site pays 100, the second 125, the third 150.
  site-bonus-marks: 25
  # Voting on every site in the menu in one day pays this once that day (needs at least two sites).
  all-sites-bonus-marks: 250

# A vote goal for the whole server each day. Every paid vote from anyone counts; it starts again at midnight.
community:
  # Votes needed in a day. 0 turns the goal off.
  daily-goal: 25
  # When it's reached: everyone who voted that day gets these Marks, and so does anyone who votes later that day.
  voter-marks: 150
  # And everyone online gets an hour of +50% XP, like an XP booster.
  booster: true

# The /vote menu. The title can use colours, like <gold> or <gradient:#C59AFA:#8CE8ED>.
menu:
  title: '<gold><bold>Vote for Aerborne</bold></gold>'

# The sites in the /vote menu, one tile each. Clicking a tile gives the player that site's vote link.
#   name         what the tile says (up to 40 letters)
#   url          the site's vote page for the server (https://)
#   service      the name the site sends with each vote. If it differs from 'name', votes still pay, but
#                the tile can't tell when the player can vote again. /nerdadmin vote shows the names of
#                the latest votes, so after a site's test vote copy it from there.
#   icon         any item, like grass_block, diamond or emerald (paper if left out)
#   slot         optional: 10-16, 19-25 or 28-34 in the menu. Sites without one line up in the middle.
#   description  optional: a line or two under the name
# After editing, /nerdadmin vote reload shows the change without a restart.
sites: []
# Remove the [] above and the # in front of these lines, then put in your own pages:
#  - name: Planet Minecraft
#    url: https://www.planetminecraft.com/server/your-server/vote/
#    service: PlanetMinecraft.com
#    icon: grass_block
