# Companion sculptures: each companion is built from small block displays, like the armor-stand pets
# Hypixel and Mineplex made popular. Edit this file in plugins/NerdSMP/ and restart to reshape them.
#
# Units are pixels: 16 = one block. The model stands on the ground at 0,0,0 and faces +Z (forward).
#   at:    centre of the block [x, y, z]       size: [width, height, depth]
#   block: any block id (WHITE_WOOL, MOSS_BLOCK, POPPY, AMETHYST_BLOCK...)
#   group: what moves it. leg_a / leg_b swing in opposite pairs while walking, tail wags, head nods,
#          ear twitches, wing_left / wing_right flap, flame flickers. Leave it out for parts that stay still.
#   glow:  true to light the part at full brightness (embers, eyes that shine).
# pivots: where a group rotates from. Legs, ears and flames default to their own base, wings to their
# inner edge, and heads and tails to their nearest end.
# bounce: none, trot (a little bob while walking) or hop (rabbit hops).

pufflet:
  bounce: none
  pivots:
    wing_left: [-5, 6.5, -1]
    wing_right: [5, 6.5, -1]
  parts:
    - { block: WHITE_WOOL, at: [0, 5, 0], size: [8, 7, 8] }
    - { block: WHITE_WOOL, at: [0, 9.5, 0.5], size: [6, 3, 6] }
    - { block: WHITE_WOOL, at: [-4.5, 5, 0], size: [3, 5, 6] }
    - { block: WHITE_WOOL, at: [4.5, 5, 0], size: [3, 5, 6] }
    - { block: WHITE_WOOL, at: [0, 5, -4.5], size: [6, 5, 3] }
    - { block: BLACK_CONCRETE, at: [-1.8, 6, 4.1], size: [1.2, 1.6, 0.3] }
    - { block: BLACK_CONCRETE, at: [1.8, 6, 4.1], size: [1.2, 1.6, 0.3] }
    - { block: PINK_CONCRETE, at: [-3, 4.6, 4.1], size: [1.4, 0.8, 0.3] }
    - { block: PINK_CONCRETE, at: [3, 4.6, 4.1], size: [1.4, 0.8, 0.3] }
    - { block: LIGHT_GRAY_WOOL, at: [-2, 0.8, 1], size: [2, 1.6, 2], group: leg_a }
    - { block: LIGHT_GRAY_WOOL, at: [2, 0.8, 1], size: [2, 1.6, 2], group: leg_b }
    - { block: WHITE_WOOL, at: [-6.3, 6.5, -1], size: [1, 3, 4], group: wing_left }
    - { block: WHITE_WOOL, at: [6.3, 6.5, -1], size: [1, 3, 4], group: wing_right }

