# Thornwood Canopy: a night climb through the treetops, with a long way down. Thin the forest's creatures
# (enemy forces) and put the Briar Matron down to reach the Thornheart Shaman. Full reference: docs/EXPEDITIONS.md.
title: Thornwood Canopy
description: Spiders own the treetops now. Thin their numbers and face the shaman at the Heart Tree.
icon: dark_oak_sapling
dimension: overworld
# Built from code. Delete this line if you rebuild the template by hand.
sample: thornwood_canopy
published: true
difficulty: 3
level: 12
party: {min: 1, max: 5}
time-limit-minutes: 40
# Bump when a map changes enough that old best times mean nothing; clears and keys are kept.
records-version: 1
time: 18000
spawn: [0, 64, 4, 0]
exit: [0, 78, 144]
modifiers: []
requires: [hollow_barrow]
goal: forces
forces: 80
# Below this, a ranger's line catches you and puts you back where you last stood, or in the fight you're in.
falls: {below: 52, damage: 4, message: "A ranger's line snaps taut and hauls you back up. Ilsa keeps them strung for a reason."}
motes: firefly

npcs:
  ilsa:
    name: Ranger Ilsa
    entity: villager
    at: [3, 64, 5, 90]
    # She offers the daily in content/world-quests.yml, and takes it back at the far end of the run.
    quests: ranger_ilsa
    lines:
      - "The canopy's crawling. Webs on every bough, and something big nesting in the dead trunk to the west."
      - "Thin them out and the Shaman will have to answer. He won't open the gate for a handful."
      - "The span south of the Fork is up. Hit the four signal boards in the east boughs and it comes down."
      - "Mind the edges. My lines will catch you, but they won't catch you gently."
      - "Verrin held the high perch for twenty years. He never came down. If you go up there, take him my regards."

campfires:
  rootgate_fire: {at: [-3, 64, 7], lit: true, title: Rootgate Fire}
  fork_fire: {at: [0, 64, 65], lit: false, title: The Fork}
  heartgate_fire: {at: [6, 78, 110], lit: false, title: Heart Gate}

setpieces:
  heart_span: {box: [-2, 63, 80, 2, 63, 83], block: spruce_planks, style: rise}
  span_west: {box: [-3, 63, 80, -3, 65, 83], block: spruce_planks, style: rise}
  span_east: {box: [3, 63, 80, 3, 65, 83], block: spruce_planks, style: rise}
  nest_wall: {box: [-62, 64, 82, -54, 67, 85], block: air, style: crumble}

# Things in the rooms that players use during a fight.
devices:
  sac_1: {at: [-49, 64, 54], title: Brood Sac}
  sac_2: {at: [-60, 64, 50], title: Brood Sac}
  sac_3: {at: [-71, 64, 54], title: Brood Sac}
  sac_4: {at: [-75, 64, 65], title: Brood Sac}
  sac_5: {at: [-71, 64, 76], title: Brood Sac}
  sac_6: {at: [-60, 64, 80], title: Brood Sac}
  sac_7: {at: [-49, 64, 76], title: Brood Sac}
  cistern_north: {at: [-7, 78, 127], title: Rain Cistern}
  cistern_west: {at: [-9, 78, 136], title: Rain Cistern}
  cistern_east: {at: [9, 78, 136], title: Rain Cistern}

hazards:
  # A trail leaves that block behind the lane for `burn` seconds, and poisons whoever it hits.
  web_lines:
    type: lane
    trail: cobweb
    area: [-78, 64, 46, -42, 64, 84]
    every: 11
    count: 1
    damage: 5
    burn: 6
    lanes: [[-76, 59, -44, 59], [-44, 71, -76, 71], [-52, 49, -52, 81], [-68, 81, -68, 49]]
  web_lines_doubled:
    type: lane
    trail: cobweb
    area: [-78, 64, 46, -42, 64, 84]
    every: 10
    count: 2
    damage: 5
    burn: 6
    lanes: [[-76, 59, -44, 59], [-44, 71, -76, 71], [-52, 49, -52, 81], [-68, 81, -68, 49], [-77, 65, -44, 65]]
  # A brood swells its devices one at a time. Each hatches `mob` unless someone bursts it first.
  brood_sacs: {type: brood, area: [-78, 64, 46, -42, 64, 84], every: 15, count: 1, mob: "custom:thornling", devices: [sac_1, sac_2, sac_3, sac_4, sac_5, sac_6, sac_7]}
  # A gust blows along one of its lanes, from the first [x, z] towards the second. Something solid upwind is cover.
  canopy_gale: {type: gust, area: [28, 71, 26, 54, 71, 46], every: 14, damage: 2, lanes: [[28, 36, 54, 36], [41, 46, 41, 26]]}
  thorn_lanes:
    type: lane
    trail: sweet_berry_bush
    area: [-23, 78, 115, 23, 78, 159]
    every: 10
    count: 2
    damage: 7
    burn: 5
    lanes: [[0, 143, 0, 118], [-6, 142, -19, 127], [6, 142, 19, 127], [-11, 148, -17, 150], [11, 148, 17, 150]]
  # A burndown lights one section each pulse. It falls away unless someone uses its device, which works once.
  heart_deck:
    type: burndown
    area: [-23, 78, 115, 23, 78, 159]
    sections:
      - {box: [-10, 72, 115, 10, 82, 125], device: cistern_north}
      - {box: [-23, 72, 115, -11, 82, 159], device: cistern_west}
      - {box: [11, 72, 115, 23, 82, 159], device: cistern_east}
  spore_drift: {type: gas, area: [-20, 77, 118, 20, 77, 156], every: 12, count: 2, damage: 0}
  thorn_burst: {type: eruption, area: [-20, 77, 118, 20, 77, 156], every: 9, count: 3, damage: 5}

# Sounds that drift through the dark. `every` is about how many seconds apart; `area` keeps one to a room.
ambience:
  - {sound: block.azalea_leaves.step, every: 12, volume: 0.6, pitch: 0.6}
  - {sound: entity.spider.ambient, every: 20, volume: 0.45, pitch: 0.6}
  - {sound: block.bamboo_wood_hanging_sign.step, every: 18, volume: 0.6, pitch: 0.5}
  - {sound: entity.parrot.imitate.spider, every: 40, volume: 0.4, pitch: 0.6}
  - {sound: item.elytra.flying, every: 34, volume: 0.12, pitch: 0.6}
  - {sound: ambient.crimson_forest.mood, every: 40, volume: 0.8, pitch: 0.7}
  - {sound: entity.spider.step, every: 8, volume: 0.5, pitch: 0.7, area: [-78, 60, 45, -42, 90, 85]}
  - {sound: block.fire.ambient, every: 8, volume: 0.6, pitch: 0.6, area: [-23, 76, 115, 23, 100, 160]}

# The opening scene, played as the run starts, and the narration after the win.
intro: prologue
outro:
  - "The embers in the Heart Tree gutter out. Green creeps back along the bark."
  - "Ranger Ilsa: 'Something sent that fire up through the roots, from where the water used to run. Find out why the aqueduct stopped.'"

cutscenes:
  # A flyover of the climb, branch by branch. `to` moves the camera over the shot; `fade` cuts to it.
  prologue:
    - {at: [0.5, 70, 0, 0, 12], to: [0.5, 70, 8, 0, 8], seconds: 4, title: "<green>Thornwood Canopy</green>", text: "<dark_green>The Heart Tree's crown</dark_green>", sound: "block.azalea_leaves.step 0.6", lines: ["|The Wardens planted the Heart Tree to hold the islands' roots together. Its roots still drink from the deep, and something in the deep is burning."]}
    - {at: [0.5, 71, 18, 0, 14], to: [0.5, 70, 38, 0, 10], seconds: 5, fade: true, lines: ["ilsa|The spiders came first. Then the archers in the high boughs."]}
    - {at: [-5, 71, 55, -30, 24], to: [5, 71, 55, 30, 24], seconds: 4, fade: true, lines: ["|The Fork joins it all. West, a dead trunk full of something's young. East, the signal boughs, and the span they lower."]}
    - {at: [-26, 69, 65, 90, 6], to: [-30, 68, 65, 90, 2], seconds: 3, fade: true, lines: ["ilsa|Don't go in that trunk without your wits about you."]}
    - {at: [0.5, 82, 104, 0, -6], to: [0.5, 82, 112, 0, -9], seconds: 4, fade: true, lines: ["|At the top of the climb, the Thornheart Shaman tends a fire that should never burn in living wood."]}
  # Timed with the Matron's entrance below: she comes down on a single thread.
  matron_wakes:
    - {at: [-46, 67, 65, 90, -6], to: [-48, 67, 65, 90, -24], seconds: 3, sound: "entity.spider.ambient 0.5", lines: ["|Something shifts in the dark at the top of the trunk. A thread catches the light."]}
    - {at: [-49, 67, 65, 90, -14], to: [-49, 67, 65, 90, 0], seconds: 5, title: "<green>The Briar Matron</green>", text: "<gray>Mother of the canopy</gray>", lines: ["The Briar Matron|More flies for my web."]}
  verrin_wakes:
    - {at: [41.5, 73, 43, 180, -18], to: [41.5, 73, 43, 180, -4], seconds: 5, sound: "item.elytra.flying 0.6", lines: ["|A rope drops out of the crown overhead, and a man comes down it hand over hand."]}
    - {at: [41.5, 73, 43, 180, 0], seconds: 3, title: "<dark_green>Verrin</dark_green>", text: "<gray>Last of the high rangers</gray>", lines: ["Verrin|Twenty years on this perch. Nobody relieved me. Nobody passes."]}
  # Timed with the Shaman's entrance below: fire runs down from the knots, and roots grow up round the spot.
  heart_wakes:
    - {at: [0.5, 83, 120, 0, 12], to: [0.5, 82, 126, 0, 8], seconds: 5, text: "<dark_green>The Heart Tree stirs…</dark_green>", sound: "block.fire.ambient 0.6", lines: ["|Embers glow deep in the bark, and run down the grain towards the deck."]}
    - {at: [-11, 81, 131, -50, 8], to: [11, 81, 131, 50, 8], seconds: 5}
    - {at: [0.5, 81, 129, 0, 6], to: [0.5, 80, 130, 0, 2], seconds: 2}
    - {at: [0.5, 80, 130, 0, -4], seconds: 3, title: "<green>The Thornheart Shaman</green>", text: "<gray>Keeper of the Heart Tree, rotted by embers</gray>", sound: "entity.evoker.prepare_summon 0.8", lines: ["The Thornheart Shaman|The fire below promised me a forest that never dies. Burn with me!"]}

mobs:
