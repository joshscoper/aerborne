        - {at: 30, abilities: [fire_pools, tether, summon], title: "The Heart Tree bleeds"}
      enrage-seconds: 360
      adds-at-health: [50]
      waves:
        - {"vanilla:spider": 3}
      scripts:
        start:
          - "cutscene heart_tree"
          - "wait 6"
          - "say The Thornheart Shaman|You burned my children. The wood remembers."
        health-60: ["hazard start spore_cloud"]
        health-30: ["hazard start thorn_burst", "say The Thornheart Shaman|Root and thorn, rise!"]
        clear: ["hazard stop spore_cloud", "hazard stop thorn_burst", "say ilsa|The canopy's quiet. Head out by the east steps when you're ready."]

guide:
  overview: A night climb through the treetops. Thin out the spiders and archers (watch the enemy forces bar) until the Thornheart Shaman comes down to fight at the Heart Tree.
  tips:
    - The final grove stays shut until enemy forces reach 100%. The optional Sentinel Boughs to the west help if you're short.
    - Falling off the Bough Run puts you back on the deck without spending a life.
    - Mire Weavers are elites. Their webs pin you; break line of sight or kill them first.
    - Bring fire resistance and a bucket of milk for the grove's spores.
  rooms:
    bough_run: A jump course of leaf pads and log beams. One step up, one long beam.
    webbed_hollow: Spiders, cave spiders and two Mire Weavers all at once.
    sentinel_boughs: Optional. Thorn Sentinels and skeletons shooting from a perch to the west; each counts double.
    briar_nest: The Briar Matron webs and poisons, and calls more spiders. A second brood follows.
    thornheart_grove: The Thornheart Shaman fights with fangs from the ground and summoned vexes, plus his own abilities.
  boss: The Thornheart Shaman (an evoker) snaps rows of fangs up from the deck and calls vexes, as evokers do. He also drops poison clouds and chains players to him. At 60% the grove fills with spores and he calls spiders; at 30% fire pools join in and thorns burst from the deck. Spread out for the fangs, and kill the vexes fast.
loot:
  marks: 180
  items: {string: 12, spider_eye: 4, experience_bottle: 4, oak_sapling: 2}
