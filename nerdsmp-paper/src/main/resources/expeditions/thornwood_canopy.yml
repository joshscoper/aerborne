    encounter:
      type: puzzle
      scripts:
        start: ["say ilsa|Pads and beams, one at a time. The leaves hold better than they look."]
  webbed_hollow:
    title: The Webbed Hollow
    region: [-10, 60, 42, 5, 75, 64]
    checkpoint: [0, 64, 62, 0]
    points: [[-7, 64, 46], [2, 64, 46], [-7, 64, 58], [2, 64, 58], [-3, 64, 52], [1, 64, 61]]
    encounter:
      type: clear
