# Shown in the guide book (/expedition guide thornwood_canopy) and on the website.
guide:
  lore: "The Heart Tree was planted by the Wardens to bind the islands' roots, and its shamans have tended it since the Sundering. Its roots drink from the deep places of the world, and lately the deep has been burning. The Thornheart Shaman tasted the ember-rot in the sap and heard a promise in it: a forest that never dies. Now thorns choke the canopy, spiders nest in the dead trunks, and Ranger Ilsa is one of the few who still climbs it. Her partner Verrin went up to the high perch years ago and never came down."
  overview: A night climb through the treetops, with a long way down. Thin out what lives in the canopy (watch the enemy forces bar), lower the span from the Signal Boughs in the east, and kill the Briar Matron in the dead trunk to the west. Then the climb opens to the Heart Gate and the Thornheart Shaman. Verrin waits on the high perch for anyone who goes looking.
  tips:
    - Enemy forces fill as you kill. The Heart Gate stays shut until they reach 100%, the span is down and the Matron is dead, so clear more than you strictly have to.
    - If you fall, a ranger's line hauls you back to where you last stood and it stings. In a boss fight you land by the door.
    - Light the fires at the Fork and the Heart Gate. If you fall in a fight, that's where you run back from, and everything you've killed stays dead.
    - Mire Weavers and Rotbark Acolytes hang back. A green line means venom is coming down it, so sidestep, and stop an Acolyte's mending with a charged hit.
    - Sporebacks burst as they die. Step off the ring around the body.
    - Something's tucked away off the west rail of the Low Boughs, if you can make the jumps.
  rooms:
    signal_boughs: East of the Fork. Clear the boughs, take a bow from the barrel by the rail and hit all four signal boards within 30 seconds. That lowers the span south of the Fork.
    matrons_nest: West of the Fork, past the Silk Walk, which has to be clear before the trunk will open. Her webs run down the pale strips in the floor; the two props stop them. Right-click a glowing sac before it hatches. If she wraps someone, break the cocoon at their feet. Below half she throws venom and the webs come two at a time. Killing her breaks the south wall, and the catwalk behind it runs to the foot of the climb.
    verrins_perch: Optional. Up the stair from the Signal Boughs. Verrin shoots from a distance, and there are no rails to the north and east. When leaves stream past you the wind is about to hit, so get a stump between you and it. Below half he takes to the ropes and appears behind you.
    heart_grove: The fire in the bark runs down to the deck, and roots grow up around the Shaman. Light the Heart Gate fire before you go in. See the boss briefing.
  boss: The Thornheart Shaman (an evoker) snaps rows of fangs up from the deck and calls vexes, as evokers do. He also pins players with roots, drops poison clouds and chains players to him, while thorns run out along the roots in the boards. Three times the deck catches fire. Right-click that stretch's rain cistern before it falls; each works only once, and a stretch you lose stays gone. At 60% the grove fills with spores and he calls spiders; at 30% fire pools join in and thorns burst from the deck.
loot:
  marks: 180
  items: {briar_silk: 6, thornheart_sap: 2, experience_bottle: 4}
# Campaign credit is set in the season file (campaign/season.yml), not here.
