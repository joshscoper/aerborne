# Thornwood Canopy: decks and rope bridges among giant trees at night. Clear enough of the forest's
# creatures (enemy forces) to wake the Thornheart Shaman. Full reference: docs/EXPEDITIONS.md.
title: Thornwood Canopy
description: Spiders own the treetops now. Thin their numbers and face the shaman at the Heart Tree.
icon: dark_oak_sapling
dimension: overworld
sample: thornwood_canopy
published: true
difficulty: 3
level: 12
party: {min: 1, max: 5}
time-limit-minutes: 30
spawn: [0, 64, 4, 0]
exit: [10, 64, 112]
modifiers: []
requires: [hollow_barrow]
goal: forces
forces: 30

npcs:
  ilsa:
    name: Ranger Ilsa
    entity: villager
    at: [3, 64, 5, 90]
    lines:
      - "The canopy's crawling. Webs on every bough, and something big nesting past the hollow."
      - "Thin them out and the shaman will come down from the Heart Tree. He won't show for a handful."
      - "The archers on the west boughs are worth hunting if you're short. Nobody makes you, mind."
      - "Fall off the branches and I'll haul you back up to the deck. Costs you nothing but pride."

campfires:
  rootgate_fire: {at: [-3, 64, 7], lit: true, title: Rootgate Fire}
  hunters_fire: {at: [3, 64, 97], lit: false, title: Hunter's Fire}

hazards:
  thorn_burst: {type: eruption, area: [-12, 63, 104, 12, 63, 120], every: 8, count: 3, damage: 4}
  spore_cloud: {type: gas, area: [-12, 63, 104, 12, 63, 120], every: 10, count: 2, damage: 0}

cutscenes:
  heart_tree:
    - {at: [0.5, 76, 102, 0, 30], seconds: 3, text: "<dark_green>The Heart Tree stirs…</dark_green>"}
    - {at: [0.5, 68, 112, 0, 6], seconds: 3, text: "<green>The Thornheart Shaman descends</green>"}

mobs:
