  "custom:canopy_stalker": {abilities: [leap]}
  "custom:mire_weaver": {role: elite, abilities: [web, venom_spit], behavior: caster}
  "custom:thorn_sentinel": {forces: 2, abilities: [cleave]}
  "custom:bough_sniper": {forces: 2, abilities: [pin_shot, arrow_rain], behavior: caster}
  "custom:sporeback": {forces: 2, abilities: [poison_cloud], on-death: spore_burst}
  "custom:rotbark_acolyte": {forces: 3, abilities: [mend, root_snare], behavior: caster}
  "custom:silk_cocoon": {forces: 0}
  "custom:verrin_the_lost": {behavior: caster}

