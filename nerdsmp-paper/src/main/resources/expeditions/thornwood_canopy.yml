  east_north: {at: [36, 64, 57], mobs: {"custom:bough_sniper": 2, "custom:rotbark_acolyte": 1}}
  east_south: {at: [36, 64, 73], mobs: {"custom:sporeback": 2, "custom:canopy_stalker": 2}}
  east_far: {at: [46, 64, 65], mobs: {"custom:mire_weaver": 1, "custom:thorn_sentinel": 1}}
  # The Silk Walk: these must fall before the nest will open.
