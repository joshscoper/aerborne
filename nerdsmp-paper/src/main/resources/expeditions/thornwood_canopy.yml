  low_east: {at: [13, 64, 33], mobs: {"custom:bough_sniper": 2, "custom:thorn_sentinel": 1}}
  low_walkers:
    at: [0, 64, 31]
    mobs: {"custom:sporeback": 2, "custom:canopy_stalker": 1}
    aggro: 7
    patrol: [[0, 64, 31], [0, 64, 44]]
  low_far: {at: [14, 64, 44], mobs: {"custom:rotbark_acolyte": 1, "custom:canopy_stalker": 2}}
  # The Fork.
  fork_north: {at: [-6, 64, 59], mobs: {"custom:canopy_stalker": 2, "custom:rotbark_acolyte": 1}}
  fork_south: {at: [6, 64, 71], mobs: {"custom:thorn_sentinel": 2, "custom:bough_sniper": 1}}
  # The Signal Boughs.
