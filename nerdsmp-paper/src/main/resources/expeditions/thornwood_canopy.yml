  west_weavers: {at: [-32, 64, 59], mobs: {"custom:mire_weaver": 2, "custom:thornling": 2}}
  west_brood: {at: [-32, 64, 72], mobs: {"custom:sporeback": 2, "custom:rotbark_acolyte": 1}}
