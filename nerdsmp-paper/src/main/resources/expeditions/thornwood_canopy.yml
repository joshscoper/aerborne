        - {"vanilla:spider": 4, "custom:mire_weaver": 2, "vanilla:cave_spider": 2}
      scripts:
        start: ["say ilsa|Weavers! The pale ones spit webs and poison. Kill them first."]
        clear: ["say ilsa|The hollow's clear. The archers' boughs are west if you want more; the nest is south."]
  sentinel_boughs:
    title: The Sentinel Boughs
    optional: true
    requires: [webbed_hollow]
    region: [-24, 60, 49, -17, 75, 63]
    points: [[-22, 64, 52], [-19, 64, 52], [-22, 64, 60], [-19, 64, 60], [-20, 64, 56]]
    encounter:
      type: clear
      waves:
        - {"custom:thorn_sentinel": 4, "vanilla:skeleton": 2}
      scripts:
        start: ["message <gray>Bowstrings creak in the boughs.</gray>"]
  briar_nest:
    title: The Briar Matron's Nest
    requires: [webbed_hollow]
    region: [-8, 60, 71, 11, 75, 92]
    checkpoint: [0, 64, 91, 0]
    points: [[0, 64, 81], [-5, 64, 75], [8, 64, 75], [-5, 64, 88], [8, 64, 88]]
    encounter:
      type: waves
      waves:
        - {"custom:briar_matron": 1, "vanilla:cave_spider": 3}
