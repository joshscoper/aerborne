reward-chests:
  free: [314, 64, 288]
  bonus: [326, 64, 288]

rooms:
  high_gate:
    title: The High Gate
    region: [-30, 60, -46, 30, 100, 9]
    requires-packs: [stair_watch, stair_guard, high_landing, gate_sentinel]
    seal: [-5, 64, -44, 5, 69, -44]
    gate: [-3, 64, 8, 3, 72, 8]
    checkpoint: [0, 64, -41, 0]
    points: [[0, 64, -16, 180], [-14, 64, -24], [14, 64, -24], [-14, 64, -6], [14, 64, -6]]
    encounter:
      type: boss
      boss: custom:thane_orrek
      # He stands on the peak of the gate, sounds his horn, and steps off.
      entrance: {style: plunge, seconds: 8, sources: [[0, 119, 7, 0]]}
      boss-damage: 0.75
      abilities: [dancing_blade, cleave]
      phases:
        - {at: 66, abilities: [dancing_blade, cleave, charge], title: "Orrek sounds the Horn of the Watch"}
        - {at: 33, abilities: [dancing_blade, cleave, charge, arc_bolt], title: "The storm answers the horn"}
      enrage-seconds: 300
      adds-at-health: [66, 33]
      waves:
        - {"custom:hall_aspirant": 2, "custom:hall_marksman": 1}
        - {"custom:hall_shieldmaiden": 1, "custom:hall_thundercaller": 1}
      scripts:
        start: ["cutscene orrek_wakes", "wait 9", "say vell|He's fast with that blade, and it comes back the same way it went. Stay off the red line."]
        health-66: ["hazard start gate_gale", "say Thane Orrek|Rise, watch! Rise, wind!", "say vell|The horn! Get behind the standing stones, or it will throw you off the stair!"]
        health-33: ["hazard start gate_bolts", "say Thane Orrek|The watch stands!"]
        clear: ["hazard stop gate_gale", "hazard stop gate_bolts", "npc vell -8 64 26 0", "message <yellow>The bronze doors of the High Gate grind open.</yellow>", "say vell|He can rest now. I'm coming up. West, east or south, it's yours to choose. I'll be at the hall's fire."]
  ember_court:
    title: The Ash Court
    region: [-96, 60, 24, -52, 88, 68]
    requires: [high_gate]
    requires-packs: [ember_bridge]
    seal: [-52, 64, 44, -52, 70, 48]
    gate: [-96, 64, 44, -96, 70, 48]
    checkpoint: [-56, 64, 46, 90]
    points: [[-74, 64, 40, 90], [-74, 64, 52, 90], [-68, 64, 46], [-80, 64, 46], [-74, 64, 46]]
    puzzles:
      braziers:
        type: targets
        title: Light the four braziers with arrows
        blocks: [[-66, 65, 37], [-66, 65, 55], [-82, 65, 37], [-82, 65, 55]]
        supply: [-62, 64, 51]
        seconds: 30
    encounter:
      type: council
      bosses: ["custom:keeper_sael", "custom:keeper_oren"]
      # Kill one and the other has this long before it brings the first one back.
      link-seconds: 12
      boss-damage: 0.7
      abilities: [fire_pools, ember_burst]
      phases:
        - {at: 40, abilities: [fire_pools, ember_burst, charge], title: "The Keepers burn brighter"}
      enrage-seconds: 240
      scripts:
        start: ["cutscene keepers_wake", "wait 5", "say vell|Those two kept each other's fires. Bring them down together, or one will light the other again.", "wait 6", "say vell|And the four braziers bar the throne. There's a bow in the crate by the door: arrows into all four targets, inside thirty seconds."]
        solved-braziers: ["sound item.firecharge.use 0.8", "message <gold>The four braziers roar.</gold>"]
        clear: ["message <gold>The bars to the Ember Throne lift.</gold>", "say vell|The way's open. Light that fire before you cross."]
  ember_throne:
    title: The Ember Throne
    region: [-166, 60, 16, -110, 110, 76]
    requires: [ember_court]
    requires-packs: [ember_far]
    seal: [-110, 64, 44, -110, 70, 48]
    checkpoint: [-114, 64, 46, 90]
    # Each warden's seal, broken, leaves something of it with the whole party.
    boon: {title: "Warden's Favour: Ember", damage: 12, fireproof: true}
    points: [[-138, 64, 46, 90], [-126, 64, 38], [-126, 64, 54], [-150, 64, 38], [-150, 64, 54]]
    encounter:
      type: boss
      boss: custom:ember_warden
      # The two great braziers catch, their flames run to a turning circle, and it rises in a column of fire.
      entrance: {style: summon, delay: 1, seconds: 9, sources: [[-138, 68, 28], [-138, 68, 64]]}
      boss-level-bonus: 2
      boss-damage: 0.75
      abilities: [fire_pools]
      # Its powers go with the fire: it uses the rite of whichever brazier it stands nearest.
      stances:
        - {at: [-138, 64, 28], title: The Rite of Ash, abilities: [fire_pools, arc_bolt, ember_burst]}
        - {at: [-138, 64, 64], title: The Rite of Flame, abilities: [meteor, charged_pulse, ember_burst]}
      phases:
        - {at: 50, abilities: [fire_pools], title: "The embers flare"}
      enrage-seconds: 330
      adds-at-health: [70, 35]
      waves:
        - {"custom:ember_wisp": 2, "custom:ash_acolyte": 1}
        - {"custom:ember_wisp": 3}
      scripts:
        start: ["cutscene ember_wakes", "wait 10", "say vell|Watch which brazier it stands by! It takes up that rite. Drag it to the one you can live with.", "say The Ember Warden|The flame does not yield its seal."]
        health-50: ["hazard start ember_rain", "hazard start ember_runnels"]
        clear: ["hazard stop ember_rain", "hazard stop ember_runnels", "say vell|The ember seal breaks! I can feel it from here. That warmth you've got? Keep it. It's yours until you leave."]
  frost_court:
    title: The Rime Stacks
    region: [52, 60, 24, 96, 88, 68]
    requires: [high_gate]
    requires-packs: [frost_bridge, frost_stacks]
    seal: [52, 64, 44, 52, 70, 48]
    gate: [96, 64, 44, 96, 70, 48]
    checkpoint: [56, 64, 46, -90]
    points: [[74, 64, 38], [74, 64, 54], [66, 64, 46], [82, 64, 46]]
    puzzles:
      chimes:
        type: sequence
        title: Ring the chimes in the frost's order
        blocks: [[70, 66, 51], [70, 66, 41], [78, 66, 51], [78, 66, 41]]
        order: [3, 1, 4, 2]
        show: true
    encounter:
      type: waves
      waves:
        - {"custom:frostmarked": 2, "custom:rime_stalker": 1}
        - {mobs: {"custom:rime_hound": 3}, delay-seconds: 5}
      scripts:
        start: ["say vell|The archive's stacks, frozen where they stood. Those four gold chimes hold the east gate. Watch the frost rise from them: that's the order to ring them in."]
        solved-chimes: ["sound block.note_block.chime 1.0", "message <aqua>The last note rings out.</aqua>"]
        clear: ["message <aqua>The ice in the east gate cracks, and the way to the Frost Throne is open.</aqua>"]
  frost_throne:
    title: The Frost Throne
    region: [110, 60, 16, 166, 110, 76]
    requires: [frost_court]
    requires-packs: [frost_far]
    seal: [110, 64, 44, 110, 70, 48]
    checkpoint: [114, 64, 46, -90]
    boon: {title: "Warden's Favour: Frost", speed: 1, guard: 5}
    points: [[138, 64, 46, -90], [126, 64, 38], [126, 64, 54], [150, 64, 38], [150, 64, 54]]
    encounter:
      type: boss
      boss: custom:frost_warden
      # The cold runs in from these marks and closes on a pillar of ice, which splits open.
