  stair_watch: {at: [0, 50, -118], mobs: {"custom:hall_aspirant": 3, "custom:hall_thundercaller": 1}, aggro: 10}
  stair_guard: {at: [0, 50, -108], mobs: {"custom:hall_shieldmaiden": 1, "custom:hall_marksman": 2}}
  high_landing: {at: [0, 57, -78], mobs: {"custom:hall_aspirant": 2, "custom:hall_marksman": 2, "custom:hall_runecarver": 1}, aggro: 10}
  gate_sentinel: {at: [0, 57, -66], mobs: {"custom:gate_sentinel": 1, "custom:hall_thundercaller": 2}}
  # The Hall of Seals.
  nave_watch: {at: [0, 64, 28], mobs: {"custom:hall_shieldmaiden": 1, "custom:hall_aspirant": 2, "custom:hall_runecarver": 1}, aggro: 9}
  west_aisle: {at: [-20, 64, 46], mobs: {"custom:hall_marksman": 2, "custom:hall_thundercaller": 1}}
  east_aisle: {at: [20, 64, 46], mobs: {"custom:hall_aspirant": 3, "custom:hall_runecarver": 1}}
  south_aisle: {at: [0, 64, 66], mobs: {"custom:hall_shieldmaiden": 1, "custom:hall_marksman": 2}}
