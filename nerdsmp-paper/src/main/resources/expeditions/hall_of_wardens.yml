guide:
  lore: "When the Wardens bound Pyrrhax beneath Cinder Keep, they wrote the Binding into three seals and left them in their sky archive, guarded by echoes of themselves and by the dead of their own Hall. Archivist Vell has studied the seals all her life. Now a Steward named Ashkar is digging, drowning and burning his way towards the keep, and Vell believes he means to wake his master. The seals open the Ember Gate, and the echoes will not hand them to anyone who has not earned them."
  overview: Climb the Long Stair and beat Thane Orrek at the High Gate. Behind it is the Hall of Seals, with three wings. Take them in any order, and each warden you beat leaves a blessing on the party. When all three seals are broken, a tear opens over the dais in the Hall of Seals. Walk through it and finish what the Wardens started.
  tips:
    - Each warden leaves a Favour on the whole party until the run ends. Ember adds damage, Frost adds speed, and Stone turns blows aside.
    - The wings are long. Light the fire in the Hall of Seals and the one in each court as you pass, because that's where you run back from.
    - Thane Orrek's horn calls a gale off the plaza. Stand behind one of the standing stones when the wind rises.
    - The Ash Court's crate has a bow and arrows, and the four braziers need arrows within thirty seconds.
    - Watch the frost on the pillars in the Rime Stacks. It flashes the chime order, and a wrong chime starts it over.
    - Throw anything onto the Court of Kings' plates. One item each keeps them down.
    - Thundercallers, Ember Wardens and anything casting Void Bolt can be stopped mid-cast with a charged hit.
  rooms:
    high_gate: Thane Orrek throws a blade along a red line and it comes back the same way. Below two-thirds his horn brings a gale across the plaza, so hide behind the standing stones. Below a third, lightning arcs between anyone standing close.
    ember_court: The Keepers of the Flame fight together. Kill them within twelve seconds of each other or the survivor brings the other back. Then light the four braziers with arrows.
    ember_throne: The Ember Warden takes up the powers of whichever brazier it stands by. The Rite of Ash is fire pools and arcing bolts, the Rite of Flame is meteors and a pulse that throws you back. Move it to the one you'd rather face. Below half, fire falls and runs along the floor.
    frost_court: Frostmarked, stalkers and hounds, while you ring four chimes in the order the frost shows you.
    frost_throne: The Frost Warden shares its cold among everyone in the ring, so stand in it together. At 60% it goes to ground and sends out its hounds. It comes back hunting one player at a time, leaving ice behind it.
    stone_court: Four kings, one at a time, and each one takes up the strength of the last. The final two rise together. Then weigh down the three plates.
    stone_throne: The Stone Warden slams, leaps and winds up a heavy blow. Below two-thirds it throws down its Aegis, and everyone has to stand inside the ring around it before the sky falls.
    the_unwritten: Oriveth, the Unwritten Warden. Light the fire on the rock before you cross. See the boss briefing.
  boss: Oriveth starts behind an echo of each Warden, one on each plate, and can't be hurt until all three are dead. Then she takes up all three seals and fights with fire, frost and stone alongside her own void magic. Below two-thirds she binds pairs of players, who have to get far apart, opens eyes that cast until they're killed, and brands players to the matching plate on the floor. Below a third the disc starts tearing away from the edge, and Black Harvest sends rings across the floor, each with one gap to stand in.
