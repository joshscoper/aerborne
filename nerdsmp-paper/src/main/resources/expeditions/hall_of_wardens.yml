# The Hall of the Three Wardens: a sky citadel on one long axis. The Long Stair climbs to the High Gate, the gate opens on
# the Hall of Seals, and three wings go out from it to the wardens of ember, frost and stone, in any order. With all three
# seals broken a portal tears open over the dais, and behind it is the fourth Warden, the one the record leaves out.
# Full reference: docs/EXPEDITIONS.md.
title: The Hall of the Three Wardens
description: "Climb the Long Stair, take the High Gate, and break the seals of ember, frost and stone."
icon: lodestone
dimension: overworld
sample: hall_of_wardens
published: true
difficulty: 4
level: 24
party: {min: 1, max: 5}
time-limit-minutes: 45
# Bump when a map changes enough that old best times mean nothing; clears and keys are kept.
records-version: 2
time: 12300
spawn: [0, 42, -178, 0]
exit: [320, 64, 286, 0]
modifiers: []
requires: [gloomforge_mines]
goal: bosses
# The clouds catch nobody. The hall's wind does, and sets you down hurt.
falls: {below: 20, damage: 4, message: "The wind off the Hall catches you, and throws you back on the stones."}

npcs:
  vell:
    name: Archivist Vell
    entity: villager
    at: [-5, 42, -176, 0]
    # She offers the daily in content/world-quests.yml, and takes it back in the Hall of Seals.
    quests: archivist_vell
    lines:
      - "I have read every word the Wardens left, and I have never climbed this stair. Nobody has. The echoes keep it."
      - "At the top of the Long Stair is Thane Orrek. He held that gate in life and he doesn't know he's dead. When he sounds his horn, get behind something heavy."
      - "West is ember, east is frost, south is stone. The order is yours. Each seal you break leaves a little of its warden with you, and you'll want all of it."
      - "The Ember Warden's powers go with the fire. It uses whichever brazier it stands by, so choose which one you fight it at."
      - "When the Frost Warden shares out the cold, stand together in the ring. Alone, it will kill you. Shared, it's only a chill."
      - "The Stone Warden brings the sky down. It will throw down its Aegis first. Get behind it."
      - "The Wardens made the seals out of themselves. I don't know what happens when all three are broken. Nothing in the record goes that far."
      - "There's a hole in the archive. Every list of the Wardens has a line scraped off the page, always the fourth. I've never found out why."

campfires:
  camp_fire: {at: [7, 42, -176], lit: true, title: "Vell's Camp"}
  hall_fire: {at: [5, 64, 22], lit: false, title: The Hall of Seals}
  ember_fire: {at: [-78, 64, 59], lit: false, title: The Ash Court}
  frost_fire: {at: [74, 64, 33], lit: false, title: The Rime Stacks}
  stone_fire: {at: [-13, 64, 120], lit: false, title: The Court of Kings}
  margin_fire: {at: [326, 64, 250], lit: false, title: The Margin}

# A tear in the Hall of Seals, drawn in particles. It opens when the last warden falls and stays open until she's dead.
portals:
  the_tear:
    title: Something tears open over the dais in the Hall of Seals
    at: [0, 66, 46]
    to: [320, 64, 250, 0]
    radius: 3
    room: the_unwritten
    requires: [ember_throne, frost_throne, stone_throne]
    feeds: [[-17, 64, 46], [17, 64, 46], [0, 64, 63]]
    opens: ["sound block.end_portal.spawn 0.6", "say vell|No. No, no. There's a fourth hand in the seals. All three were written by the same person, and the plates are pouring into something.", "wait 4", "say vell|Friends, there's a hole in the air over my dais. Whatever the Wardens were holding shut, it was never the fire. Go, before it closes on us."]

hazards:
  # The horn calls the wind. The standing stones on the plaza are the only cover from it.
  gate_gale:
    type: gust
    area: [-28, 63, -44, 28, 63, 12]
    every: 17
    damage: 3
    lanes: [[-28, -16, 28, -16], [28, -16, -28, -16]]
  gate_bolts: {type: rocks, area: [-24, 63, -38, 24, 63, 6], every: 9, count: 3, damage: 6}
  ember_rain: {type: fire, area: [-160, 63, 24, -116, 63, 68], every: 7, count: 4, damage: 6}
  ember_runnels:
    type: lane
    area: [-162, 63, 22, -114, 63, 70]
    every: 10
    count: 2
    damage: 7
    burn: 4
    lanes: [[-124, 24, -124, 68], [-152, 68, -152, 24], [-162, 38, -114, 38], [-114, 54, -162, 54]]
  rime_mist: {type: gas, area: [116, 63, 24, 160, 63, 68], every: 9, count: 3, damage: 0}
  rime_fall: {type: rocks, area: [116, 63, 24, 160, 63, 68], every: 8, count: 3, damage: 6}
  stone_fall: {type: rocks, area: [-22, 63, 162, 22, 63, 206], every: 6, count: 4, damage: 7}
  # Pieces of the Wardens' own wings, coming down out of the dark.
  page_fall: {type: rocks, area: [296, 63, 276, 344, 63, 324], every: 8, count: 4, damage: 7}
  # The disc goes from the edge in, a side at a time. The middle stays.
  void_tear:
    type: burndown
    area: [290, 63, 270, 350, 63, 330]
    every: 26
    sections:
      - {box: [288, 40, 270, 352, 72, 278]}
      - {box: [288, 40, 322, 352, 72, 334]}
      - {box: [286, 40, 279, 298, 72, 321]}
      - {box: [342, 40, 279, 354, 72, 321]}

ambience:
  - {sound: item.elytra.flying, every: 20, volume: 0.12, pitch: 0.6}
  - {sound: block.beacon.ambient, every: 18, volume: 0.5, pitch: 0.6, area: [-30, 60, 16, 30, 140, 76]}
  - {sound: block.fire.ambient, every: 5, volume: 0.8, pitch: 0.7, area: [-170, 55, 16, -50, 110, 76]}
  - {sound: block.lava.ambient, every: 9, volume: 0.7, pitch: 0.6, area: [-170, 55, 16, -108, 110, 76]}
  - {sound: entity.player.hurt_freeze, every: 21, volume: 0.15, pitch: 0.6, area: [50, 55, 16, 170, 110, 76]}
  - {sound: block.deepslate.step, every: 13, volume: 0.5, pitch: 0.5, area: [-30, 55, 96, 30, 110, 216]}
  - {sound: ambient.soul_sand_valley.mood, every: 24, volume: 0.9, pitch: 0.5, area: [240, 0, 220, 400, 130, 390]}
  - {sound: block.end_portal_frame.fill, every: 19, volume: 0.25, pitch: 0.5, area: [240, 0, 220, 400, 130, 390]}

# The opening scene, played as the run starts, and the narration after the win.
intro: prologue
outro:
  - "Oriveth comes apart into the dark she was kept in, and three seals settle into your hands: one warm, one cold, one heavy."
  - "Archivist Vell: 'A fourth Warden. Three to hold the fire and one to hold the three, and we scraped her name out of every book so nobody would ever go looking.'"
  - "Archivist Vell: 'With these, the Ember Gate will open. Cinder Keep waits below the clouds. Ashkar must not wake his master.'"

cutscenes:
  # One unbroken flight: up the stair, over the gate, and once round the Hall past each of its wings. Every shot runs into the next.
  prologue:
    - {at: [0.5, 47, -182, 0, -10], seconds: 6, title: "<gold>The Hall of the Three Wardens</gold>", text: "<gray>The sky archive</gray>", sound: "block.beacon.ambient", lines: ["|Here the Wardens of Ember, Frost and Stone kept the record of the Binding.", "vell|And here they left their echoes, to guard the seals until they were needed."]}
    - {at: [0.5, 62, -118, 0, -14], seconds: 6, lines: ["vell|The High Gate. Three Wardens stand over it, and a thane who never left his post stands under them."]}
    - {at: [0.5, 100, -52, 0, -18], seconds: 5, lines: ["vell|Behind it, the Hall of Seals. Each seal is a key to the road below. The Steward wants them. We need them first."]}
    - {at: [0.5, 136, -16, 0, -2], seconds: 4}
    - {at: [-50, 130, -18, 52, 8], seconds: 4}
    - {at: [-72, 124, 46, 90, 12], seconds: 5, lines: ["|Ember to the west."]}
    - {at: [0.5, 120, 118, 0, 14], seconds: 5, lines: ["|Stone to the south."]}
    - {at: [72, 124, 46, -90, 12], to: [86, 128, 46, -90, 16], seconds: 5, lines: ["|Frost to the east. The order is yours."]}
  orrek_wakes:
    - {at: [0.5, 66, -40, 0, -48], seconds: 4, sound: "item.goat_horn.sound.2 0.6", lines: ["|High over the gate, someone is standing where nobody should be able to stand."]}
    - {at: [0.5, 66, -34, 0, -52], to: [9, 67, -27, 42, 8], seconds: 4, title: "<gold>Thane Orrek</gold>", text: "<gray>Warder of the High Gate</gray>", lines: ["Thane Orrek|None pass while the watch stands. The watch stands."]}
  keepers_wake:
    - {at: [-60, 69, 46, 90, 4], to: [-64, 69, 46, 90, 4], seconds: 4, title: "<gold>The Keepers of the Flame</gold>", text: "<gray>Sael and Oren</gray>", sound: "block.fire.ambient 0.6", lines: ["Keeper Sael|The fire is not yours to carry.", "Keeper Oren|Nor ours to give."]}
  ember_wakes:
    - {at: [-116, 73, 46, 90, 10], seconds: 4, sound: "block.fire.ambient 0.6", lines: ["|The two great braziers catch by themselves, and the fire runs in across the floor."]}
    - {at: [-124, 71, 46, 90, 2], to: [-130, 69, 46, 90, -8], seconds: 6, title: "<gold>The Ember Warden</gold>", text: "<gray>Echo of the first Warden</gray>", lines: ["The Ember Warden|I sealed the fire once. Show me you could do the same."]}
  frost_wakes:
    - {at: [116, 73, 46, -90, 10], seconds: 4, sound: "block.glass.break 0.6", lines: ["|The cold comes in from every side of the arena at once, and it all comes to one place."]}
    - {at: [124, 71, 46, -90, 2], to: [130, 68, 46, -90, -6], seconds: 5, title: "<aqua>The Frost Warden</aqua>", text: "<gray>Echo of the second Warden</gray>", lines: ["The Frost Warden|Cold kept him sleeping. Is your nerve as cold?"]}
  kings_wake:
    - {at: [0.5, 72, 104, 0, 16], to: [0.5, 71, 108, 0, 12], seconds: 5, title: "<green>The Court of Kings</green>", text: "<gray>Four thrones, four kings</gray>", sound: "block.deepslate.break 0.5", lines: ["|Four thrones, and on the first of them the dust moves.", "King Harl|Who comes before the court? Stand, and be judged."]}
  stone_wakes:
    - {at: [0.5, 73, 162, 0, 12], seconds: 4, sound: "block.stone.break 0.5", lines: ["|The moss on the floor lifts. There are bones of stone under it, and they are moving."]}
    - {at: [0.5, 71, 170, 0, 6], to: [0.5, 69, 176, 0, -6], seconds: 6, title: "<green>The Stone Warden</green>", text: "<gray>Echo of the third Warden</gray>", lines: ["The Stone Warden|Stone holds. Stone endures. Do you?"]}
  oriveth_wakes:
    - {at: [320.5, 76, 276, 0, 4], seconds: 5, sound: "ambient.soul_sand_valley.mood 0.5", lines: ["|There is nothing written here. There never was. The seals' plates are burning on a floor that left the Hall a long time ago."]}
    - {at: [320.5, 80, 284, 0, -10], seconds: 6, lines: ["Oriveth|Three to hold the fire, and one to hold the three. Did your archivist leave that part out?", "Oriveth|No. She couldn't have read it. I took it out myself."]}
    - {at: [322, 70, 286, 8, -28], to: [332, 69, 290, 45, -12], seconds: 4, title: "<dark_purple>Oriveth</dark_purple>", text: "<gray>The Unwritten Warden</gray>", sound: "entity.ender_dragon.growl 0.5", lines: ["Oriveth|You carried my seals all this way. How kind."]}

