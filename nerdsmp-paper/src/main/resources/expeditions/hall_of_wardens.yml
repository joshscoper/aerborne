guide:
  overview: A floating citadel with three wings. Each wing has a puzzle antechamber and a warden. Defeat all three wardens, in any order, then step into the light at the centre of the concourse.
  tips:
    - The ember antechamber's supply crate hands out a bow and arrows. The braziers need four arrows within thirty seconds.
    - Watch the frost pillars when you enter the east wing; they flash the chime order. A wrong chime resets it.
    - Throw counterweights from the crate (or any items) onto the stone plates; one each keeps them down.
    - Every warden gets harder below half health and calls helpers at 60%. Rest at the concourse fire between wings.
  rooms:
    ember_antechamber: Two blazes while you shoot four targets on the brazier pedestals.
    ember_throne: The Ember Warden scatters fire pools and volleys, then meteors. Fire falls across the arena in the second half.
    frost_antechamber: Two frostmarked elites while you ring four chimes in the order shown.
    frost_hall: The Frost Warden freezes, blinks and shoots. Below half it chains players and drops crushing ice; poison mist rises.
    stone_antechamber: Silverfish and a vindicator while you weigh down three plates.
    stone_court: The Stone Warden slams and leaps. Below half it shields itself behind its guards and the ceiling of the sky gives way.
  boss: Each warden has its own style. Ember is fire and volleys, Frost is freezing and blinking, Stone is slams and leaps. All three call helpers at 60% health, change abilities below half, and enrage after five minutes.
loot:
