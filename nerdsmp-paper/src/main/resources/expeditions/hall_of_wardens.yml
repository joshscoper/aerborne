        health-66: ["hazard start page_fall", "say Oriveth|You came all this way to read me. Read this.", "say vell|When she brands you, look at the colour! Run to the plate that matches!"]
        health-33: ["hazard start void_tear", "say Oriveth|Let's see what's left of you when the page is blank.", "say vell|The floor is going! Stay towards the middle, and find the gap in those black rings!"]
