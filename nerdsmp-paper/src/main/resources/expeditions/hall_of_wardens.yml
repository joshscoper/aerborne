    patrol: [[-14, 64, 36], [14, 64, 36]]
  # West.
  ember_bridge: {at: [-40, 64, 46], mobs: {"custom:ash_acolyte": 3}, aggro: 7}
  ember_far: {at: [-103, 64, 46], mobs: {"custom:ash_acolyte": 2, "custom:ember_wisp": 2}, aggro: 7}
  # East.
  frost_bridge: {at: [40, 64, 46], mobs: {"custom:rime_stalker": 2, "custom:frostmarked": 1}, aggro: 7}
  frost_stacks: {at: [66, 64, 46], mobs: {"custom:rime_stalker": 2, "custom:rime_hound": 2}}
  frost_far: {at: [103, 64, 46], mobs: {"custom:rime_hound": 3, "custom:frostmarked": 1}, aggro: 7}
  # South.
  stone_bridge: {at: [0, 64, 86], mobs: {"custom:archive_sentry": 2, "custom:stonemite": 4}, aggro: 7}
  stone_far: {at: [0, 64, 149], mobs: {"custom:archive_sentry": 2, "custom:stonemite": 3}, aggro: 7}

