# Gloomforge Mines: a descent through five levels of the deep galleries, past Grell, along the Ore Line with
# the Blastmaster's carts, through the Round Foundry and down to the Gloomforge itself.
# Full reference: docs/EXPEDITIONS.md.
title: Gloomforge Mines
description: The night shift never came back up. Go down after them, level by level, and silence the Gloomforge.
icon: iron_pickaxe
dimension: overworld
# Built from code. Delete this line if you rebuild the template by hand.
sample: gloomforge_mines
published: true
difficulty: 4
level: 20
party: {min: 1, max: 5}
time-limit-minutes: 45
# Bump when a map changes enough that old best times mean nothing; clears and keys are kept.
records-version: 2
spawn: [14, 97, -2, 0]
exit: [233, 17, 60]
modifiers: []
requires: [sunken_aqueduct]
goal: forces
forces: 70
# Black water at the bottom of the mine. Hesk's lines are the only way out of it.
falls: {below: 11, damage: 3, message: "A miner's line hauls you out of the black water, coughing. Don't drink it."}

npcs:
  hesk:
    name: Old Miner Hesk
    entity: villager
    at: [11, 97, 8, 90]
    # He offers the daily in content/world-quests.yml, and takes it back at the far end of the run.
    quests: old_miner_hesk
    lines:
      - "Forty years I worked these levels. Five of them, each deeper and hotter than the last. Nobody's come back up from the bottom one."
      - "Past the galleries is the Gullet. Walk the ledge round the wall and don't look down. Well. Look down once."
      - "On the Mainline, when the bell rings, you get into a refuge. There's no arguing with a loaded cart."
      - "The Blastmaster runs the Ore Line now. A cart will flatten him same as it'll flatten you, if you can get him on the rails."
      - "Bank the Foundry's dampers and the north door opens. After that it's all downhill, and the water's waiting."
      - "There's a place off the Foundry's south causeway where the slag boils by itself. My brother swore something took his line there. All he brought home was the grip of the rod."

