# Gloomforge Mines: a gauntlet of three mini-bosses through the deep galleries, then the Deep
# Foreman himself. Full reference: docs/EXPEDITIONS.md.
title: Gloomforge Mines
description: The night shift never came back up. Fight through the foremen of the deep and silence the Gloomforge.
icon: iron_pickaxe
dimension: overworld
sample: gloomforge_mines
published: true
difficulty: 4
level: 20
party: {min: 1, max: 5}
time-limit-minutes: 35
spawn: [0, 64, 5, 0]
exit: [0, 64, 139]
modifiers: []
requires: [sunken_aqueduct]

npcs:
  hesk:
    name: Old Miner Hesk
    entity: villager
    at: [-3, 64, 9, 90]
    lines:
      - "Three bosses ran the Gloomforge: Grell, the Blastmaster and that slag-fed hound. Now they answer to the Foreman."
      - "Ring the alarms in the galleries. Shoot the targets on the three bell posts, quick as you can."
      - "The Blastmaster's carts need loading before the far door opens. There's a crate of counterweights by the door: throw them on the plates."
      - "When the Foreman's angry the whole delve shakes. Stay off the pillars."

campfires:
  lift_fire: {at: [4, 64, 8], lit: true, title: Lift Station Fire}
  miners_rest: {at: [3, 64, 109], lit: false, title: "Miners' Rest"}

setpieces:
  west_pillars: {box: [-7, 66, 121, -6, 76, 134], block: air, style: crumble}

hazards:
  blast_charges: {type: fire, area: [-9, 63, 62, 9, 63, 81], every: 8, count: 3, damage: 4}
  pit_rockfall: {type: rocks, area: [-9, 63, 86, 9, 63, 103], every: 6, count: 3, damage: 5}
  delve_rockfall: {type: rocks, area: [-12, 63, 115, 12, 63, 132], every: 6, count: 4, damage: 6}

# The opening scene, played as the run starts, and the narration after the win.
intro: prologue
outro:
  - "Among the Foreman's papers: a contract sealed with a burning crown, signed 'Ashkar, Steward of the Sovereign'."
  - "Old Miner Hesk: 'The Archivist up in the sky citadel will know that seal. Take it to the Hall of the Wardens.'"

cutscenes:
  prologue:
    - {at: [0.5, 67, 3, 0, 5], seconds: 5, title: "<gold>Gloomforge Mines</gold>", text: "<gray>The deep galleries</gray>", sound: "block.anvil.land 0.5", lines: ["|The Gloomforge was dug for gloomsteel, the dark ore that drinks the light.", "hesk|Forty years I worked these galleries. Never dug this deep. Never wanted to."]}
    - {at: [0.5, 68, 20, 0, 10], seconds: 5, fade: true, lines: ["hesk|The Deep Foreman took a new contract. Paid in gold, with orders to dig straight down.", "hesk|Down towards the old keep. Towards the heat."]}
    - {at: [0.5, 70, 118, 0, 20], seconds: 4, lines: ["|At the bottom of the delve, the Foreman's lamp burns with a flame that isn't his own."]}
  foreman:
    - {at: [0.5, 73, 116, 0, 25], seconds: 3, text: "<gold>The Foreman's Delve</gold>", sound: "block.anvil.land 0.6", lines: ["|The picks fall silent. The pillars groan."]}
    - {at: [0.5, 68, 125, 0, 5], seconds: 4, title: "<dark_red>The Deep Foreman</dark_red>", text: "<gray>Who dug too deep for a buyer he never met</gray>", sound: "entity.ravager.roar 0.7", lines: ["The Deep Foreman|The Steward pays in gold, and gold doesn't ask questions. Get off my site!"]}

mobs:
  "custom:gloom_miner": {role: normal}
  "custom:grell_overseer": {role: miniboss, abilities: [charge, cleave]}
  "custom:blastmaster": {role: miniboss, abilities: [barrage, fire_pools]}
  "custom:slag_hound": {role: miniboss, abilities: [charge, leap]}
  "custom:powder_sapper": {role: elite, abilities: [barrage]}

