guide:
  lore: "Gloomsteel is the dark ore that drinks light, and the Gloomforge has mined it for generations. Old Miner Hesk worked these galleries for forty years. Then the Deep Foreman took a new contract: payment in gold from a buyer who signs with a burning crown, and orders to dig straight down towards the old keep. Overseer Grell, the Blastmaster and the slag-fed hound follow the Foreman now, and the deeper they dig, the hotter the stone runs."
  overview: A gauntlet through the deep galleries. Ring the alarms, then beat three mini-bosses (Overseer Grell, the Blastmaster and the Slag Hound) before the Deep Foreman.
  tips:
    - The supply crate by the galleries' entrance hands out a bow and arrows. The alarm targets have to be hit within 25 seconds of the first.
    - Throw anything heavy onto the Blasting Hall's two cart plates; an item on each keeps them down.
    - Each mini-boss gets the boss bar. Kill its helpers first if you're struggling.
    - In the Foreman's second half the west pillars collapse and rocks fall all through the delve. Keep moving.
  rooms:
    ore_galleries: Gloom miners and a pillager while you shoot the targets on three alarm posts.
    grells_shaft: Overseer Grell charges and cleaves. Don't get knocked into the open shaft.
    blasting_hall: The Blastmaster fires volleys and sets the floor alight, and blasting charges go off around the hall. Load both ore carts with counterweights from the supply crate.
    slag_pits: The Slag Hound charges and leaps while rock falls from the ceiling. Stay off the glowing slag.
    foremans_delve: The Deep Foreman, his miners, and a cave-in.
  boss: The Deep Foreman slams the ground and calls his miners; at three-quarters and two-fifths health more arrive. Below half he charges, drops a crushing rock on one player (stand with them to share it), the west pillars collapse and rocks fall throughout the delve.
loot:
  marks: 260
  items: {raw_iron: 12, raw_gold: 6, diamond: 1, experience_bottle: 5}
