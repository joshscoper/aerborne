guide:
  lore: "Gloomsteel is the dark ore that drinks light, and the Gloomforge has mined it for generations. Old Miner Hesk worked these levels for forty years. Then the Deep Foreman took a contract from a buyer he never met, paid in old gold, with one instruction: dig straight down. The night shift never came back up."
  overview: A descent through five levels of the mine. Thin the galleries, walk down the Gullet, beat Overseer Grell, run the Mainline, break the Blastmaster on the Ore Line, bank the Round Foundry, and cross the black water to the Deep Foreman on the Gloomforge. The Slag Hound waits off the Foundry if you want it.
  tips:
    - Enemy forces fill as you kill. The door to the Gloomforge stays barred until they reach 100%, so clear more than you strictly have to.
    - When a bell rings and sparks run down a rail, a cart is about two seconds behind them. Get off that track. On the Mainline, that means a refuge in the wall.
    - Carts hit anything on the rails. They kill the crews outright, and they stun a boss and take a slice of its health.
    - Light every fire you pass. If you fall in a fight, that's where you run back from, and everything you've killed stays dead.
    - The black water at the bottom won't kill you, but it stings on the way out.
    - The east drift off the first crosscut goes nowhere useful, which is why nobody ever found what's at the end of it.
  rooms:
    grells_shaft: Overseer Grell charges and cleaves, and the timber loads over his cave come down one at a time. Bait him under one for a free stun.
    the_mainline: One long tunnel with rails down the middle. Fight down it, and dive into a refuge when the bell rings.
    ore_line: A rail yard. Carts cross it on seven tracks, faster as the fight goes on, and powder carts blow up at the end of the line. Lure the Blastmaster onto the rails.
    round_foundry: Fight off the forge's thralls and pull the three damper levers to open the north door.
    slag_pits: Optional. The Slag Hound charges and leaps, slag runs across the floor, and rock falls from the roof.
    the_gloomforge: The Deep Foreman, on the deck of the furnace barge. Light the Last Dock's fire before you cross. See the boss briefing.
  boss: The Deep Foreman slams the deck and calls his crew. Ore skips hang over the deck on chains and come down one by one, so drag him under one. Below two-thirds he charges and the forge vents fire across the deck, and below a third he drops crushing rocks on the party while the roof comes in.
loot:
  marks: 260
  items: {raw_iron: 12, raw_gold: 6, diamond: 1, experience_bottle: 5}
