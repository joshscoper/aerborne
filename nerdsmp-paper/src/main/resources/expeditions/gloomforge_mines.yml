  grells_strongbox: {at: [7, 64, 57], kind: chest, title: "Grell's Strongbox"}
  lost_miners_stash: {at: [-9, 64, 103], kind: secret, title: "Lost Miner's Stash"}

# Where the reward chests appear when the run is won.
