# The opening scene, played as the run starts, and the narration after the win.
intro: prologue
outro:
  - "The Gloomforge goes cold. For the first time in a hundred years the deep levels are quiet."
  - "Among the Foreman's papers: a contract sealed with a burning crown, signed 'Ashkar, Steward of the Sovereign'."
  - "Old Miner Hesk: 'The Archivist up in the sky citadel will know that seal. Take it to the Hall of the Wardens.'"

cutscenes:
  # The whole way down, one level at a time.
  prologue:
    - {at: [14.5, 103, -10, 0, 6], to: [14.5, 102, -2, 0, 2], seconds: 5, title: "<gold>Gloomforge Mines</gold>", text: "<gray>Five levels down</gray>", sound: "block.anvil.land 0.5", lines: ["hesk|The night shift went down and the lift came back empty. That was the last anyone saw of them."]}
    - {at: [32.5, 121, 64, 0, 38], to: [32.5, 112, 70, 0, 44], seconds: 5, fade: true, lines: ["|The Gullet. Two turns of ledge round a drop that swallows the lamps."]}
    - {at: [102, 62, 170, -90, 8], to: [120, 62, 170, -90, 6], seconds: 4, fade: true, lines: ["|Below that, the Ore Line. The carts still run. Nobody's loading them."]}
    - {at: [122.5, 44, 116, 180, 10], to: [122.5, 42, 108, 180, 6], seconds: 4, fade: true, lines: ["|Below that, the Round Foundry, and a heat that doesn't belong in stone."]}
    - {at: [192, 27, 34, -90, 6], to: [208, 25, 34, -90, 4], seconds: 5, fade: true, lines: ["hesk|And at the bottom, the Gloomforge. The Foreman took a new contract, paid in gold, with orders to dig straight down.", "hesk|He dug until he hit water, and he kept going."]}
  grell_wakes:
    - {at: [50.5, 75, 131, 0, 18], to: [50.5, 74, 133, 0, 12], seconds: 4, title: "<red>Overseer Grell</red>", text: "<gray>He still counts the shift</gray>", sound: "block.bell.use 0.6", lines: ["Overseer Grell|Late. All of you. That's a day's pay."]}
  ore_line_wakes:
    - {at: [102, 60, 170, -90, 14], to: [112, 59, 170, -90, 10], seconds: 4, title: "<gold>The Blastmaster</gold>", text: "<gray>Keeper of the Ore Line</gray>", sound: "block.bell.use 0.8", lines: ["The Blastmaster|Mind the rails! Ha! No, don't. Stand right there."]}
  hound_wakes:
    - {at: [171, 34, 112, -90, 6], to: [177, 34, 112, -90, 4], seconds: 4, title: "<red>The Slag Hound</red>", text: "<gray>Something the foundry fed</gray>", sound: "entity.ravager.roar 0.6", lines: ["|Something huge shoulders up out of the slag, and shakes it off like water."]}
  foreman_wakes:
    - {at: [232, 22, 36, -15, 4], to: [233, 21, 38, -15, 2], seconds: 4, text: "<gold>The Gloomforge</gold>", sound: "block.anvil.land 0.6", lines: ["|The furnace roars. The whole hull shudders against its chains."]}
    - {at: [232, 21, 37, -15, 4], seconds: 4, title: "<dark_red>The Deep Foreman</dark_red>", text: "<gray>Who dug too deep for a buyer he never met</gray>", sound: "entity.ravager.roar 0.5", lines: ["The Deep Foreman|Shift's over when I say it's over."]}
  colossus_rises:
    - {at: [122.5, 42, 122, 180, 18], to: [122.5, 40, 118, 180, 10], seconds: 5, title: "<gold>The Molten Colossus</gold>", text: "<gray>What the Foundry was built to keep down</gray>", sound: "entity.ravager.roar 0.4", lines: ["|It comes up out of the slag on your line, and it keeps coming, and it has hands."]}

