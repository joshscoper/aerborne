# The opening scene, played as the run starts, and the narration after the win.
intro: prologue
outro:
  - "The Wardens' chains go down into the fire with what they hold, and for the first time in an age the Heart is only a mountain."
  - "Archivist Vell: 'He isn't dead. You can't kill what the Wardens couldn't. But he's bound, and this time the people above know his name.'"
  - "Old Miner Hesk: 'Forty years down the levels, and I'd do it again. Come on up, all of you. The Accord's waiting to hear how it ended.'"

cutscenes:
  prologue:
    - {at: [0.5, 70, -262, 0, -8], to: [0.5, 72, -250, 0, -20], seconds: 6, title: "<red>Cinder Keep</red>", text: "<gold>Where the Binding was made</gold>", sound: "block.lava.ambient", lines: ["|When the old world burned, the Wardens bound Pyrrhax, the Ashen Sovereign, in a heart of molten stone, and built a keep on top of him.", "|For an age he slept. His Steward never did."]}
    - {at: [-6, 68, -252, 15, 2], to: [6, 68, -252, -15, 2], seconds: 6, fade: true, lines: ["vell|Everyone's here. Everyone who owes you a debt, and I think that's all of us.", "hesk|The Huntsman, the Heart Tree, the flood, my mine. All of it was the Steward, clearing the way to this door."]}
    - {at: [0.5, 92, -246, 0, -6], to: [0.5, 104, -238, 0, 8], seconds: 5, fade: true, lines: ["vell|Bring them up to the gate. We've three seals, and one chance."]}
  seals_open:
    - {at: [0.5, 70, -252, 0, -24], to: [0.5, 74, -246, 0, -32], seconds: 5, sound: "block.end_portal_frame.fill 0.6", lines: ["vell|Ember. Frost. Stone. As it was written."]}
    - {at: [14, 74, -242, 12, -24], to: [10, 72, -240, 8, -18], seconds: 5, lines: ["|The seals go home in the stone, one after another, and something behind the wall that has not moved in an age begins to."]}
    - {at: [0.5, 72, -242, 0, -8], to: [0.5, 72, -240, 0, -4], seconds: 4, sound: "block.end_portal.spawn 0.6", title: "<gold>The Ember Gate</gold>", lines: ["|The doors don't open. They fall."]}
  drake_wakes:
    - {at: [0.5, 72, -196, 0, -2], to: [0.5, 74, -188, 0, -6], seconds: 5, sound: "block.chain.break 0.5", lines: ["|Out on the bridge a chain goes slack, then another. Something large has noticed the gate is down."]}
    - {at: [12, 70, -176, -20, -10], to: [10, 72, -172, -20, -18], seconds: 5, title: "<gold>Cindermaw</gold>", text: "<gray>The Steward's Gatewatch</gray>", sound: "entity.ender_dragon.growl 0.5", lines: ["vell|The ballistas! Get to the ballistas!"]}
  kiln:
    - {at: [-12, 72, -92, 130, 10], to: [-8, 72, -88, 130, 6], seconds: 5, title: "<gold>Gorrak the Kilnbreaker</gold>", text: "<gray>Keeper of the Great Kiln</gray>", sound: "entity.ravager.roar 0.6", lines: ["Gorrak the Kilnbreaker|More fuel for the kiln! The Sovereign hungers!"]}
  hounds:
    - {at: [0.5, 70, -40, 0, 8], to: [0.5, 69, -36, 0, 4], seconds: 4, title: "<gray>Skarn and Vesh</gray>", text: "<gray>The Steward's hounds</gray>", sound: "entity.hoglin.angry 0.7", lines: ["|Two shapes rise from the ash, one grey and one glowing. They move as one."]}
  vael_rises:
    - {at: [0.5, 72, 20, 0, -6], to: [0.5, 76, 44, 0, -8], seconds: 6, sound: "block.beacon.deactivate 0.5", lines: ["|The rows of stone penitents don't turn. They've been facing the altar for an age, and they've heard this sermon."]}
    - {at: [8, 72, 58, 20, -2], to: [6, 70, 60, 20, -4], seconds: 4, title: "<dark_red>Vael, the Slag Priest</dark_red>", text: "<gray>Who keeps the Sovereign's fires</gray>", lines: ["Vael, the Slag Priest|Kneel, and be rendered into slag for the Sovereign's waking!"]}
  steward_wakes:
    - {at: [0.5, 72, 134, 0, 4], to: [0.5, 76, 154, 0, -2], seconds: 6, sound: "block.beacon.ambient 0.5", lines: ["|Every step of it was his. The hound pens, the hill road, the contract with the burning crown. He has been expecting you for some time."]}
    - {at: [0.5, 74, 170, 0, -12], to: [0.5, 72, 174, 0, -18], seconds: 5, title: "<gold>Steward Ashkar</gold>", text: "<gray>Who never stopped serving</gray>", lines: ["Steward Ashkar|You quenched the valves? Good. It saved me the trouble of opening them for you.", "Steward Ashkar|I have held this door for an age. Come and see what for."]}
  the_reward:
    - {at: [0.5, 70, 154, 0, -2], to: [0.5, 72, 156, 0, 2], seconds: 4, lines: ["Steward Ashkar|Enough... My lord. My lord, I have done everything you asked. Every forge, every grave. It's finished. You can wake."]}
    - {at: [10, 72, 158, 25, 10], to: [8, 74, 160, 25, 14], seconds: 8, sound: "entity.warden.emerge 0.5", lines: ["|The floor of the hall lifts. He doesn't look round.", "Pyrrhax, the Ashen Sovereign|TOO SOON."]}
    - {at: [0.5, 76, 150, 0, 12], to: [0.5, 76, 154, 0, 16], seconds: 3, lines: ["|There is nothing left to say about the Steward."]}
  heart:
    - {at: [0.5, 38, 268, 0, -2], to: [0.5, 40, 282, 0, -6], seconds: 6, sound: "entity.warden.heartbeat 0.5", title: "<red>The Molten Heart</red>", lines: ["|The Wardens' chains come out of the walls of the mountain, each link the size of a room, and go down into the fire. All of them are going to the same place."]}
    - {at: [14, 42, 290, 20, -10], to: [8, 46, 296, 10, -22], seconds: 7, lines: ["|The chains go taut, and the sea stands up."]}
    - {at: [0.5, 36, 280, 0, -24], to: [0.5, 36, 284, 0, -30], seconds: 5, title: "<gold><bold>Pyrrhax</bold></gold>", text: "<gray>The Ashen Sovereign</gray>", sound: "entity.ender_dragon.growl 0.4", lines: ["Pyrrhax, the Ashen Sovereign|WHO DARES?"]}
  allies_arrive:
    - {at: [0.5, 42, 274, 0, 2], to: [0.5, 44, 268, 0, -2], seconds: 4, sound: "block.bell.use 0.5", lines: ["vell|Not alone. Not this time. Everyone, now!"]}
    - {at: [-46, 50, 262, -128, 8], to: [-42, 50, 266, -128, 6], seconds: 5, lines: ["cobb|Here's your water, friends! Every drop the Great Dam ever held!", "|High in the crater wall, somebody opens the last sluice in the world."]}
    - {at: [40, 50, 262, 130, 8], to: [36, 50, 266, 130, 6], seconds: 5, lines: ["hesk|The plates! Get on the plates! Pull his chains back on him!"]}
  the_binding:
    - {at: [0.5, 40, 270, 0, -12], to: [0.5, 44, 278, 0, -24], seconds: 8, sound: "block.chain.place 0.5", lines: ["|The last chain goes round. He doesn't roar. It's the first time anyone has seen him afraid.", "Pyrrhax, the Ashen Sovereign|THE FIRE... ALWAYS... RETURNS..."]}
    - {at: [20, 46, 284, 20, -2], to: [16, 40, 290, 20, 6], seconds: 8, lines: ["vell|And we'll be here. All of us. Every time."]}

