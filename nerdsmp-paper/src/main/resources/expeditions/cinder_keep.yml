          - "wait 6"
          - "say Pyrrhax, the Ashen Sovereign|TOO SOON! You have woken me too soon, mortals. Now you will burn!"
          - "sound entity.blaze.death 0.4"
          - "hazard start heart_rockfall"
        health-66: ["say Pyrrhax, the Ashen Sovereign|Come forth, my sons! Defend your master!"]
        health-33: ["say Pyrrhax, the Ashen Sovereign|Enough! I will finish this myself!", "hazard start heart_eruptions"]
        clear:
          - "hazard stop heart_rockfall"
          - "hazard stop heart_eruptions"
          - "say Pyrrhax, the Ashen Sovereign|This is not the end... The fire... always... returns..."
          - "message <green>The Heart dims to embers. Step onto the crying obsidian by the entrance to leave.</green>"

guide:
  overview: "Cinder Keep is a raid for two to eight players: five boss fights across nine caverns under the keep, ending at the Ashen Sovereign in the Molten Heart. Normal is tuned for pickup groups; Heroic and Mythic are for organised raids. Each boss pays its loot once per tier per week. Defeating Gorrak the Kilnbreaker opens the Nether's Cinder Shelf route to you."
  tips:
    - Bring fire resistance. Lava fills the channels, the moat and the falls, and many abilities set fires.
    - Wither skeletons inflict Wither. Carry milk or plenty of food, and rest at each campfire you light.
    - Skarn and Vesh are linked. Bring their health down evenly and kill both within ten seconds, or the first one rises again.
    - The Steward only comes out once all three rune valves in the galleries are turned.
    - Pyrrhax's Wrath throws everyone inside its ring outward. Stand with your back to solid rock, not to the moat.
    - Twice the Sovereign sinks out of reach and sends his Sons of Flame. Kill them all to bring him back sooner.
  rooms:
    descent: Flamewakers, wither skeletons, lava brutes and sulfur spawn, all at once. Cross the lava at the bridges.
    kilnbreaker: Gorrak charges and splashes fire, then slams below half health while fire spills across the kiln. Ember hounds join at 70% and 35%.
    slagfalls: Three waves along the lavafalls while slag drops from the ceiling. Light Slagfall Rest when it's over.
    cinderhounds: Skarn and Vesh, linked. They charge and leap, and add fire below 40%. Kill both within ten seconds.
    rune_galleries: Rune wardens guard three valves around a lava lake. Kill them and turn all three valves.
    slag_priest: Vael heals and scatters fire, calls firesworn at 80%, 50% and 25%, and drops meteors in the last third.
    bellows: Survive 75 seconds of waves while the vents erupt. Light the Heartgate fire afterwards.
    steward: Steward Ashkar, two guards and a priest. Kill the priest first; the causeway to the Heart rises when they fall.
    molten_heart: Pyrrhax, the Ashen Sovereign. Wrath, fire pools, meteors, falling rock, and two submerges with Sons of Flame.
  boss: "Pyrrhax fights from the central platform of the Molten Heart, ringed by a lava moat. His Wrath (a wide ring of flame) throws everyone inside it outward, so keep your back to solid rock. At 66% and 33% he sinks into the lava for up to half a minute and sends his Sons of Flame; kill them all to bring him back sooner. Below a third, the floor erupts. He enrages after ten minutes."
loot:
  marks: 200
  items: {gold_ingot: 8, quartz: 16, experience_bottle: 6}
# Raid tiers: Normal is tuned for pickup groups; Heroic and Mythic are for organised raids.
tiers:
  normal: {lives: 15}
  heroic: {lives: 10, health-multiplier: 1.9, damage-multiplier: 1.4}
  mythic: {lives: 6, health-multiplier: 3.0, damage-multiplier: 1.8, modifiers: [fortified, tyrannical]}
