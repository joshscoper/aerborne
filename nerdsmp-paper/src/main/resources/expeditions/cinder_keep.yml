        down-3: ["say Steward Ashkar|Alone, then. So be it."]
        clear:
          - "say Steward Ashkar|Enough... Go, then. Meet my lord, and burn."
          - "build heart_causeway"
          - "sound block.basalt.place 0.6"
          - "message <gold>A causeway of stone rises across the moat of the Molten Heart.</gold>"
