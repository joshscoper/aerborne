# Cinder Keep: the first raid, for up to eight players. Beneath the keep a fire lord stirs in the
# Molten Heart, and his servants work the forges to wake him. Runs in a real Nether dimension, so
# the sky, fog, ash and Nether rules all apply. Full reference: docs/EXPEDITIONS.md.
#
# The season campaign seals it until a milestone unlocks it (see campaign/season.yml). Defeating
# Gorrak the Kilnbreaker, on any tier, opens the Nether's Cinder Shelf route to everyone who was there.
# Each boss pays its loot once per tier per week; the lockouts reset on Monday (UTC).
title: Cinder Keep
description: "A raid for up to eight. Descend through the caverns under the keep and put the Ashen Sovereign back to sleep."
icon: blackstone
dimension: nether
biome: basalt_deltas
sample: cinder_keep
published: true
raid: true
difficulty: 5
level: 26
party: {min: 2, max: 8}
time-limit-minutes: 75
spawn: [0, 64, -112, 0]
exit: [0, 64, 133]
modifiers: []
requires: [hall_of_wardens]

npcs:
  hesk:
    name: Hesk the Forgewright
    entity: villager
    at: [-3, 64, -109, 0]
    lines:
      - "You came down the stair? Then you've seen the forges. They should have gone cold an age ago."
      - "Pyrrhax, the Ashen Sovereign, sleeps in the Molten Heart. His Steward means to wake him, and every forge down here feeds the waking."
      - "Gorrak keeps the great kiln. Break him and his hold on the Cinder Shelf breaks with him: the Nether opens to you."
      - "Skarn and Vesh run as a pair. Kill one and the other calls it back. Bring them down together."
      - "Three runes hold the Heart's seal. Quench all three valves in the galleries or the Steward will never come out to meet you."
      - "When the Sovereign raises his hammer, get your back to solid rock. His wrath throws you clean across the hall, and the moat is lava."

campfires:
  forge_camp: {at: [4, 64, -110], lit: true, title: Forgewright's Camp}
  slagfall_rest: {at: [5, 64, -16], lit: false, title: Slagfall Rest}
  heartgate_fire: {at: [-5, 64, 98], lit: false, title: Heartgate Fire}

setpieces:
  heart_causeway: {box: [-2, 63, 136, 2, 63, 141], block: polished_blackstone_bricks, style: rise}

hazards:
  slag_rain: {type: rocks, area: [-9, 63, -40, 9, 63, -14], every: 6, count: 4, damage: 6}
  kiln_fire: {type: fire, area: [-11, 63, -68, 11, 63, -48], every: 8, count: 4, damage: 5}
  bellows_vents: {type: eruption, area: [-9, 63, 78, 9, 63, 98], every: 5, count: 4, damage: 5}
  heart_eruptions: {type: eruption, area: [-11, 63, 142, 11, 63, 164], every: 6, count: 5, damage: 6}
  heart_rockfall: {type: rocks, area: [-12, 63, 141, 12, 63, 165], every: 7, count: 4, damage: 7}

cutscenes:
  kiln:
    - {at: [0.5, 74, -70.5, 0, 28], seconds: 3, text: "<gold>Gorrak's Kiln</gold>"}
  hounds:
    - {at: [0.5, 70, -8.5, 0, 20], seconds: 3, text: "<gray>The Hound Pens</gray>"}
  heart:
    - {at: [0.5, 82, 133.5, 0, 32], seconds: 3, text: "<red>The Molten Heart</red>"}
    - {at: [0.5, 70, 147.5, 0, 12], seconds: 3, text: "<gold><bold>Pyrrhax rises</bold></gold>"}

mobs:
  "custom:flamewaker": {role: normal}
  "custom:lava_brute": {role: elite, abilities: [cleave, charge]}
  "custom:rune_warden": {role: elite, abilities: [cleave, fire_pools]}
  "custom:firesworn": {role: normal}
  "custom:ember_hound": {role: normal}
  "custom:son_of_flame": {role: elite, abilities: [slam]}
  "vanilla:wither_skeleton": {role: normal}

rooms:
  descent:
    title: The Scorched Descent
    region: [-12, 61, -102, 12, 79, -74]
    checkpoint: [0, 64, -100, 0]
    gate: [-1, 64, -73, 1, 66, -73]
    points: [[-5, 64, -96], [5, 64, -96], [-5, 64, -80], [5, 64, -80], [0, 64, -84], [-6, 64, -92]]
    encounter:
      type: clear
      waves:
        - {"custom:flamewaker": 4, "vanilla:wither_skeleton": 2}
        - {"custom:lava_brute": 2, "custom:sulfur_spawn": 2}
      scripts:
        start: ["say hesk|They've seen you. Flamewakers! Keep off the lava and cross at the bridges."]
        clear: ["say hesk|The kiln's beyond the bars. Mind Gorrak's charge."]
  kilnbreaker:
    title: Gorrak's Kiln
    region: [-15, 61, -72, 15, 85, -44]
    checkpoint: [0, 64, -70, 0]
    gate: [-1, 64, -43, 1, 66, -43]
    points: [[0, 64, -52], [-8, 64, -58], [8, 64, -58], [-6, 64, -47], [6, 64, -47]]
    unlocks: [nether]
    loot:
