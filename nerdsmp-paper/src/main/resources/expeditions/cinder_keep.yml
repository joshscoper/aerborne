    title: The Molten Heart
    region: [-24, 61, 130, 24, 97, 176]
    checkpoint: [0, 64, 133, 0]
    points: [[0, 64, 159], [-8, 64, 147], [8, 64, 147], [-10, 64, 154], [10, 64, 154], [0, 64, 145]]
    loot:
      marks: 300
      items: {netherite_scrap: 2, diamond: 3, gold_block: 2}
    encounter:
      type: boss
      boss: custom:pyrrhax
      boss-level-bonus: 4
      abilities: [wrath, fire_pools]
      phases:
        - {at: 66, abilities: [wrath, fire_pools, meteor], title: "Sons of Flame", submerge-seconds: 30}
        - {at: 33, abilities: [wrath, meteor, barrage, fire_pools], title: "The Sovereign's fury", submerge-seconds: 25}
