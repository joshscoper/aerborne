    lanes: [[-14, -186, 14, -186], [14, -178, -14, -178], [-14, -170, 14, -170], [14, -162, -14, -162], [-14, -154, 14, -154], [-9, -190, -9, -150], [9, -150, 9, -190]]
  kiln_fire: {type: fire, area: [-30, 63, -106, 20, 63, -52], every: 8, count: 5, damage: 6}
