# Cinder Keep: the season's last raid, for up to eight players. The three seals open the Ember Gate, the Chain Bridge crosses
# the gulf under a drake's wings, and the keep is taken from the ward to the throne. Under the throne is the Molten Heart, and
# everyone who helped you get here comes to see it finished. Runs in a real Nether dimension, so the sky, fog, ash and Nether
# rules all apply. Full reference: docs/EXPEDITIONS.md.
#
# The season campaign seals it until a milestone unlocks it (see campaign/season.yml). Defeating
# Gorrak the Kilnbreaker, on any tier, opens the Nether's Cinder Shelf route to everyone who was there.
# Each boss pays its loot once per tier per week; the lockouts reset on Monday (UTC).
title: Cinder Keep
description: "The season's last raid, for up to eight. Open the Ember Gate, take the keep, and put the Ashen Sovereign back in his chains."
icon: blackstone
dimension: nether
biome: basalt_deltas
sample: cinder_keep
published: true
raid: true
difficulty: 5
level: 26
party: {min: 2, max: 8}
time-limit-minutes: 90
# Bump when a map changes enough that old best times mean nothing; clears and keys are kept.
records-version: 2
spawn: [0, 64, -252, 0]
exit: [0, 32, 272, 0]
modifiers: []
requires: [hall_of_wardens]
# The gulf catches you, and it doesn't let go gently.
falls: {below: 18, damage: 6, message: "Cobb's lines find you over the fire, and haul you back singed."}

npcs:
  vell:
    name: Archivist Vell
    entity: villager
    at: [-6, 64, -248, 0]
    lines:
      - "Three seals, and I can feel every one of them. Whatever's behind that gate has been listening for them for a very long time."
      - "There's a drake on the bridge. The Steward chained it there when the world was young. There are ballistas on the deck: put enough iron in it and it'll come down."
      - "Everything Ashkar did, he did for this. The Huntsman, the Heart Tree, the flood, the mine. All of it was to get a keep full of fire and a door left open."
  hesk:
    name: Old Miner Hesk
    entity: villager
    at: [6, 64, -248, 0]
    lines:
      - "Forty years I worked the levels, and I never thought I'd come down this far. Gorrak keeps the great kiln. Break him and the Cinder Shelf opens to you."
      - "Skarn and Vesh run as a pair. Kill one and the other calls it back. Bring them down together."
      - "Three valves hold the cathedral's fires. Vael won't come out from behind the altar until they're shut."
  cobb:
    name: Engineer Cobb
    entity: villager
    at: [-11, 64, -243, 0]
    lines:
      - "I've brought every line and every man the guild has left. If you go off the bridge, we'll fish you out."
      - "And I've brought the dam, in a manner of speaking. If it comes to it, I can get you water. Once. Don't ask me how yet."
  ilsa:
    name: Ranger Ilsa
    entity: villager
    at: [11, 64, -243, 0]
    lines:
      - "The Canopy sent everyone who can still draw a bow. We'll be where you need us."
  pell:
    name: Sexton Pell
    entity: villager
    at: [0, 64, -241, 0]
    lines:
      - "The dead of the hill road have been very patient. I said I'd tell them how it ends."

campfires:
  landing_fire: {at: [4, 64, -258], lit: true, title: The Last Landing}
  bridge_fire: {at: [4, 64, -148], lit: false, title: The Chain Bridge}
  ward_fire: {at: [-10, 64, -50], lit: false, title: The Outer Ward}
