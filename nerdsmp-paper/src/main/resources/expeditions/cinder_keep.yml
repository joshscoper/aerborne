  bellows_crate: {at: [-6, 64, 90], kind: crate, title: Bellows Crate}

# Rare companions, kept off the guides on purpose: each player rolls this chance as they open the boss's chest.
# Heroic and Mythic raise it.
companion-drops:
  chain_bridge: {companion: drakeling, chance: 0.01}
  molten_heart: {companion: ashling, chance: 0.01}

# Where the reward chests appear when the run is won.
reward-chests:
  free: [-4, 32, 276]
  bonus: [4, 32, 276]

rooms:
  ember_gate:
    title: The Ember Gate
    region: [-16, 60, -240, 16, 92, -231]
    points: [[0, 64, -232, 0]]
    encounter:
      type: none
      scripts:
        start: ["cutscene seals_open", "wait 1", "scene seals", "wait 13", "break ember_doors", "sound entity.generic.explode 0.4", "message <gold>The Ember Gate is open.</gold>"]
  chain_bridge:
    title: The Chain Bridge
    region: [-20, 60, -192, 20, 120, -148]
    requires: [ember_gate]
    requires-packs: [bridge_watch, bridge_chains]
    seal: [-6, 64, -194, 6, 68, -194]
    gate: [-8, 64, -117, 8, 73, -117]
    checkpoint: [0, 64, -190, 0]
    # Its ground, then the middle of the circle it flies round.
    points: [[0, 64, -170, 0], [0, 64, -170], [-12, 64, -180], [12, 64, -180], [-12, 64, -160], [12, 64, -160]]
    loot:
      marks: 120
      items: {sovereign_ash: 6, gold_ingot: 6, blaze_rod: 4}
    encounter:
      type: boss
      boss: custom:cindermaw
      body: cindermaw
      cast-reach: 70
      # It comes over the Ember Gate out of the fog, low enough to feel.
      entrance: {style: swoop, delay: 1, seconds: 9, sources: [[0, 92, -262, 0]]}
      boss-level-bonus: 2
      boss-damage: 0.9
      abilities: [drake_breath, fire_pools, cleave]
      phases:
        - {at: 66, abilities: [drake_breath, fire_pools, cleave, meteor], title: "Cindermaw tears free"}
        - {at: 33, abilities: [drake_breath, meteor, slam, charge], title: "Cindermaw burns the bridge"}
      enrage-seconds: 480
      adds-at-health: [80, 50, 25]
      waves:
        - {"custom:flamewaker": 3}
        - {"custom:cinder_thrall": 3, "custom:keep_arbalest": 2}
        - {"custom:lava_brute": 1, "custom:flamewaker": 2}
      scripts:
        start: ["cutscene drake_wakes", "wait 11", "flight 42 30 20", "say vell|It won't come down by itself. Harpoons, on the deck, all four corners!", "hazard start bridge_flames"]
        landed: ["say vell|It's down! Hit it with everything before it tears loose!"]
        health-66: ["flight 42 30 22", "say vell|It's up again! The ballistas are wound!"]
        health-33: ["flight 42 30 16", "say The Steward's Voice|It has held this bridge for an age. Who are you?"]
        clear: ["hazard stop bridge_flames", "say vell|It's dead. The bridge is ours, and the keep's right there. Light the fire."]
  kilnbreaker:
    title: "Gorrak's Kiln"
    region: [-52, 60, -116, 52, 104, -44]
    requires: [chain_bridge]
    requires-packs: [ward_gate, ward_forge_north, ward_forge_mid, ward_forge_south, ward_east, ward_kiln, ward_walkers]
    gate: [-3, 64, -43, 3, 71, -43]
    checkpoint: [0, 64, -112, 0]
    points: [[-4, 64, -74, 180], [-14, 64, -84], [10, 64, -84], [-14, 64, -60], [8, 64, -52]]
    unlocks: [nether]
    loot:
      marks: 120
      items: {sovereign_ash: 6, gold_ingot: 6, blaze_rod: 4, magma_cream: 4}
    encounter:
      type: boss
      boss: custom:gorrak_kilnbreaker
      # Poured out of the kiln's mouth and hammered up, like everything else that comes out of it.
      entrance: {style: forged, seconds: 9, sources: [[10, 64, -66]]}
      boss-level-bonus: 2
      abilities: [charge, fire_pools]
      phases:
        - {at: 50, abilities: [charge, slam, fire_pools], title: "The kiln roars"}
      enrage-seconds: 480
      adds-at-health: [70, 35]
      waves:
        - {"custom:ember_hound": 3}
        - {"custom:ember_hound": 2, "custom:firesworn": 2}
      scripts:
        start: ["cutscene kiln", "wait 6", "sound entity.ravager.roar 0.6"]
        health-50: ["title <red>The kiln roars|<gold>Fire spills across the yard</gold>", "hazard start kiln_fire"]
        clear: ["hazard stop kiln_fire", "say hesk|Gorrak's down! His hold on the Cinder Shelf is broken. The Nether is yours."]
  cinderhounds:
    title: The Hound Pens
    region: [-22, 60, -40, 22, 90, -8]
    requires: [kilnbreaker]
    requires-packs: [pens_kennel_west, pens_kennel_east]
    gate: [-3, 64, -2, 3, 71, -2]
    checkpoint: [0, 64, -40, 0]
    points: [[-6, 64, -18], [6, 64, -18], [-6, 64, -30], [6, 64, -30], [0, 64, -24]]
    loot:
      marks: 120
      items: {sovereign_ash: 6, gold_ingot: 6, quartz: 16}
    encounter:
      type: council
      bosses: [custom:skarn, custom:vesh]
      link-seconds: 10
      boss-level-bonus: 2
      abilities: [charge, leap]
      phases:
        - {at: 40, abilities: [charge, leap, fire_pools], title: "The pack's fury"}
      enrage-seconds: 420
      adds-at-health: [60]
      waves:
