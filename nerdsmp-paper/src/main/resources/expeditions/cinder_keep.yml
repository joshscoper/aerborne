    gate: [-1, 64, 129, 1, 66, 129]
    points: [[0, 64, 120], [-6, 64, 116], [6, 64, 116], [0, 64, 112], [-6, 64, 110], [6, 64, 110]]
    loot:
      marks: 160
      items: {gold_block: 2, blaze_rod: 6, diamond: 1}
    encounter:
