guide:
  lore: "Cinder Keep was built over the place where the Wardens bound Pyrrhax, the Ashen Sovereign, in a heart of molten stone. For an age he slept while the islands drifted above. His Steward, Ashkar, never stopped serving: he raised the Huntsman, poisoned the Heart Tree, drove the Tidewarden to drown the waterworks and paid the Deep Foreman to dig. Now every forge in the deep burns at once, and the Sovereign stirs. Everyone you've helped this season has come to the last landing. The three seals open the Ember Gate. What's behind it is the end of the story."
  overview: "Cinder Keep is the season's last raid, for two to eight players. Open the Ember Gate, bring Cindermaw down on the Chain Bridge, take the outer ward from Gorrak, the pens from Skarn and Vesh, and the Ash Cathedral from Vael. Hold the Great Bellows, then face Steward Ashkar at his throne. Under it is the Molten Heart. Normal is tuned for pickup groups; Heroic and Mythic are for organised raids. Each boss pays its loot once per tier per week, and only this raid gives Sovereign Ash, Wardens' Chain Links and the Heart of the Mountain. Defeating Gorrak opens the Nether's Cinder Shelf route to you."
  tips:
    - Bring fire resistance. Lava lies under the bridge and round the Heart, and many abilities set fires.
    - Wither skeletons inflict Wither. Carry milk or plenty of food, and light every fire you pass.
    - Cindermaw can't be touched in the air. Fire the ballistas on the deck to bring it down, and each ballista only fires once per flight.
    - Skarn and Vesh are linked. Bring their health down evenly and kill both within ten seconds, or the first one rises again.
    - The Ash Cathedral's doors stay shut until all three rune valves are turned, west, east and behind the altar.
    - When the Steward speaks the Ashen Decree, turn your back on him.
    - Sovereign Ash, Chain Links and the Heart of the Mountain only come from this raid. Take them to a forge.
  rooms:
    ember_gate: The three seals go into the wall and the doors come down.
    chain_bridge: Cindermaw, a drake chained to the bridge. It circles out of reach until enough ballistas hit it, then it crashes to the deck. It goes up again at two-thirds and one-third. Fire runs across the deck the whole fight.
    kilnbreaker: Gorrak charges and splashes fire, then slams below half health while fire spills across the yard. Ember hounds join at 70% and 35%. Beating him opens the Nether.
    cinderhounds: Skarn and Vesh, linked. They charge and leap, and add fire below 40%. Kill both within ten seconds.
    slag_priest: Vael heals and scatters fire, calls penitents at 80%, 50% and 25%, and drops meteors in the last third. Shut the three rune valves too.
    bellows: Survive 75 seconds of waves while the vents erupt. Light the fire afterwards.
    steward: Steward Ashkar, two guards and a priest. Kill the priest first, and look away when he speaks the Decree.
    molten_heart: Pyrrhax, the Ashen Sovereign. See the boss briefing.
  boss: "Pyrrhax fights from the fire at the far side of the disc, and he's far too big to miss. He raises the hammer over one side of the floor and a lane burns red: get out of it, and don't stand too close to it. His Wrath throws everyone inside its ring outward. At 70% he drives the hammer into the floor and goes under, and his Sons of Flame run for it: each one that reaches it burns everyone. Bands of the floor catch fire, and meteors roll after single players. At 40% everyone you've helped arrives. A plate lights on the floor, and enough of you on it pulls one of the Wardens' chains back round him, which costs him a tenth of his health each time. At 12% he tears loose."
loot:
  marks: 200
  items: {gold_ingot: 8, quartz: 16, experience_bottle: 6}
# Raid tiers: Normal is tuned for pickup groups; Heroic and Mythic are for organised raids.
tiers:
  heroic: {health-multiplier: 1.9, damage-multiplier: 1.4}
  mythic: {lives: 6, health-multiplier: 3.0, damage-multiplier: 1.8, modifiers: [fortified, tyrannical]}
