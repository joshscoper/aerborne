# The Hollow Barrow: a crypt crawl and the first expedition of the campaign. Copy this file to
# start your own, or build one in game with /expedition create <id>. Full reference:
# docs/EXPEDITIONS.md.
#
# Coordinates are blocks in the template world (nerdsmp_exp_tpl_hollow_barrow). Every run is a fresh
# copy of that world, so the same coordinates work in every run. Points are [x, y, z] or [x, y, z, yaw];
# regions and gates are [x1, y1, z1, x2, y2, z2].
title: The Hollow Barrow
description: A barrow-king stirs beneath the old hills. Clear his crypts and put him back to rest.
icon: skeleton_skull
dimension: overworld
# Built from code. Delete this line if you rebuild the template by hand.
sample: hollow_barrow
published: true
# 1-5 stars on the expedition board: 1 Easy, 2 Moderate, 3 Challenging, 4 Hard, 5 Brutal.
difficulty: 2
# Base mob level. Each tier adds its own level bonus on top.
level: 8
party: {min: 1, max: 5}
time-limit-minutes: 25
spawn: [0, 64, 4, 0]
exit: [0, 64, 108]
modifiers: []

npcs:
  sexton:
    name: Old Sexton Pell
    entity: zombie_villager
    at: [-4, 64, 6, 270]
    lines:
      - "Forty years I've swept these halls. Never heard the bones so restless."
      - "The King's Huntsman was buried with him. Loyal past death, that one."
      - "The vault opens only to those who pull the levers in the order the candles show."
      - "Mind the ossuary ceiling. When the dead stir, the bones come down with them."

campfires:
  mouth_fire: {at: [4, 64, 8], lit: true, title: Barrow Mouth}
  antechamber_brazier: {at: [3, 64, 79], lit: false, title: Antechamber Brazier}

hazards:
  bone_rain: {type: rocks, area: [-7, 63, 37, 7, 63, 53], every: 7, count: 3, damage: 4}
  falling_masonry: {type: rocks, area: [-10, 63, 85, 10, 63, 106], every: 9, count: 3, damage: 5}

# The opening scene, played as the run starts, and the narration after the win.
intro: prologue
outro:
  - "The Huntsman's bones settle. For a moment his face is only tired."
  - "Old Sexton Pell lays the longbow back across his chest. 'Rest now. You held the road long enough.'"

cutscenes:
  prologue:
    - {at: [0.5, 67, 3, 0, 5], seconds: 5, title: "<gray>The Hollow Barrow</gray>", text: "<dark_gray>Tomb of the Huntsman</dark_gray>", sound: "ambient.cave 0.8", lines: ["|When the world burned, the Huntsman held the hill road while the last carts climbed into the sky.", "|They buried him here with honours, his longbow across his chest."]}
    - {at: [0.5, 67, 18, 0, 10], seconds: 5, fade: true, lines: ["sexton|Something woke him. A voice from the deep, whispering of embers.", "sexton|Now he hunts the living, and the dead rise to follow."]}
    - {at: [0.5, 67, 58, 0, 10], seconds: 4, lines: ["|Past the ossuary, the Lever Vault guards the King's Rest. The candles still remember the order."]}
  king_wakes:
    - {at: [0.5, 71, 86, 0, 25], seconds: 3, text: "<gray>The King's Rest…</gray>", sound: "ambient.cave 0.6", lines: ["|The torches gutter. Bone grinds on stone."]}
    - {at: [0.5, 67, 95, 0, 12], seconds: 4, title: "<dark_red>The Hollow Huntsman</dark_red>", text: "<gray>Hero of the hill road, hollowed by embers</gray>", sound: "entity.skeleton.ambient 0.5", lines: ["The Hollow Huntsman|The road... must be held... none... pass!"]}

mobs:
  "custom:veil_stalker": {role: elite, abilities: [blink]}
  "custom:barrow_warden": {role: miniboss, abilities: [shield, cleave]}

# Loot containers: every player loots each once with their own roll. Secrets count toward the score.
chests:
  sexton_crate: {at: [5, 64, 16], kind: crate, title: "Sexton's Crate"}
  ossuary_reliquary: {at: [-7, 64, 52], kind: chest, title: Ossuary Reliquary}
  forgotten_offering: {at: [8, 64, 73], kind: secret, title: Forgotten Offering}

# Where the reward chests appear when the run is won.
reward-chests:
  free: [-2, 64, 106]
  bonus: [2, 64, 106]

rooms:
  crypt_gallery:
    title: The Crypt Gallery
    region: [-7, 64, 14, 7, 69, 34]
    checkpoint: [0, 64, 32, 0]
    # These iron bars lift when the room is cleared.
    gate: [-1, 64, 35, 1, 66, 35]
    points: [[-5, 64, 19], [5, 64, 19], [-5, 64, 29], [5, 64, 29], [0, 64, 24]]
    encounter:
      type: waves
      waves:
        - {"custom:barrow_thrall": 3, "custom:thorn_sentinel": 1}
        - {mobs: {"custom:veil_stalker": 2, "custom:crypt_archer": 2}, delay-seconds: 3}
      scripts:
        start: ["message <gray>Dust shivers from the niches. Something is waking.</gray>"]
        wave-2: ["say sexton|Veil Stalkers! They step through shadow. Watch your backs!"]
        clear: ["message <gray>The bars to the ossuary grind upward.</gray>"]
  ossuary:
    title: The Ossuary
    region: [-8, 64, 36, 8, 69, 54]
    checkpoint: [0, 64, 52, 0]
    gate: [-1, 64, 55, 1, 66, 55]
    points: [[-6, 64, 38], [6, 64, 38], [-6, 64, 51], [6, 64, 51], [0, 64, 45]]
    encounter:
      # Survive rooms keep releasing their waves until the timer runs out.
      type: survive
      survive-seconds: 45
      waves:
        - {"custom:barrow_thrall": 3}
        - {mobs: {"custom:mire_weaver": 2, "custom:crypt_archer": 1}, delay-seconds: 12}
      scripts:
        start: ["title <gold>Hold the ossuary|<gray>Survive until the bones fall still</gray>", "hazard start bone_rain"]
        timer-30: ["message <yellow>The rattling slows. Fifteen more seconds!</yellow>"]
        clear: ["hazard stop bone_rain"]
  lever_vault:
    title: The Lever Vault
    region: [-9, 64, 56, 9, 71, 74]
    checkpoint: [0, 64, 73, 0]
    gate: [-1, 64, 75, 1, 66, 75]
    points: [[-5, 64, 66], [-6, 64, 61], [6, 64, 61], [0, 64, 62], [4, 64, 67]]
    puzzles:
      vault_levers:
        type: sequence
        title: Pull the levers in the candles' order
        blocks: [[-9, 65, 60], [9, 65, 60], [-9, 65, 67], [9, 65, 67]]
        order: [3, 1, 4, 2]
        show: true
    encounter:
      type: waves
      waves:
        - {"custom:barrow_warden": 1, "custom:crypt_archer": 2}
      scripts:
        start:
          - "say The Barrow Warden|None pass the vault while I stand."
          - "say sexton|The Warden! Bring it down, then mind the candles: they show the levers' order."
        solved-vault_levers: ["sound block.iron_door.open 0.6"]
        clear: ["say sexton|The vault yields. There's a brazier in the antechamber; rest before the King."]
  kings_rest:
    title: The King's Rest
    region: [-11, 64, 84, 11, 74, 110]
    # The first point is where the boss rises; adds use the others.
    points: [[0, 65, 99], [-8, 64, 88], [8, 64, 88], [-8, 64, 104], [8, 64, 104]]
    encounter:
      type: boss
      boss: custom:the_hollow_huntsman
      boss-level-bonus: 3
      # The Huntsman is tuned down for a first expedition (1.0 = as authored).
      boss-damage: 0.6
      boss-health: 0.85
      abilities: [cleave, summon]
      phases:
        - {at: 50, abilities: [cleave, slam, tether], title: "The Huntsman calls the hunt"}
      enrage-seconds: 300
      # Each threshold releases the next wave as adds.
      adds-at-health: [66, 33]
      waves:
        - {"custom:crypt_archer": 3}
        - {"custom:veil_stalker": 2}
      scripts:
        start:
          - "cutscene king_wakes"
          - "wait 7"
          - "say The Hollow Huntsman|Who disturbs the King's rest?"
        health-50: ["say The Hollow Huntsman|The hunt is called! Bone answers bone!", "hazard start falling_masonry", "sound entity.wither_skeleton.ambient 0.6"]
        enrage: ["say The Hollow Huntsman|Enough! The King's patience ends!"]
        clear: ["hazard stop falling_masonry", "say sexton|Rest now, old king. Walk into the light at the far wall to leave."]

# Shown in the guide book (/expedition guide hollow_barrow) and on the website.
guide:
  lore: "The Huntsman was the hero of the Sundering: when the world below burned, he held the hill road against Pyrrhax's cultists while the last carts climbed into the sky. The survivors buried him in the barrow with his longbow across his chest. Generations later a voice from deep below began whispering of embers, and the Huntsman rose hollow, hunting the living for the master he once fought. Old Sexton Pell has tended the barrow all his life. He wants the Huntsman laid to rest, not destroyed."
  overview: A crypt crawl and the first stop of the campaign. Two waves of undead, a survival hold in the ossuary under falling bones, the Barrow Warden and its lever vault, then the Hollow Huntsman in his tomb.
  tips:
    - Bring a shield and a bow. Thorn Sentinels and skeletons shoot from the back of the gallery.
    - In the ossuary, stay near the middle and watch the floor for shadows; that's where bones fall.
    - Kill the Warden's skeletons to break its shield, then watch the candles for the lever order.
    - A ring of light around the Huntsman means a shockwave is coming. Step outside it.
  rooms:
    crypt_gallery: Zombies and a Thorn Sentinel come first, then Veil Stalkers (elites that blink behind you) and skeletons.
    ossuary: Survive 45 seconds. Waves keep coming and bones rain from the ceiling; you only need to stay alive.
    lever_vault: The Barrow Warden shields itself while its skeletons live. The vault also needs its four levers pulled in the order the candles flash; a wrong lever resets it.
    kings_rest: The Huntsman rises from the sarcophagus. Light the antechamber brazier first so the party regroups close by.
  boss: The Hollow Huntsman cleaves in front of him and calls skeletons. Below half health he adds a ground slam and a chain that drags one player in (break line of sight to snap it), and the ceiling starts to fall. At two-thirds and one-third health he calls more of the dead. Let one player keep him busy while the others clear the adds.
loot:
  marks: 120
  items: {iron_ingot: 4, bone: 8, experience_bottle: 3}
# Campaign credit is set in the season file (campaign/season.yml), not here.
