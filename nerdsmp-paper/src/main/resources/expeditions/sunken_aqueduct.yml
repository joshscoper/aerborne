guide:
  lore: "The aqueduct was built to carry cold water down from the clouds to the forges beneath Cinder Keep, cooling the stone that holds Pyrrhax asleep. Engineer Cobb's guild has kept it running for three centuries. When the Tidewarden, the aqueduct's ancient keeper, felt the deep stone warming, she sealed the floodgates and drowned the valley to smother the heat. Cobb thinks she has gone mad. The truth is worse."
  overview: A timed run up a drowned valley. Cross the Long Span, stop Old Bess in the Pump House, hold the Cistern while it floods, get past the chief engineer in the Pressure Gallery, weigh down the floodgates and face the Tidewarden at the foot of the Great Dam. A stair down the bastion's west tower leads to the Silt Bed, if you have the time.
  tips:
    - The clock is the danger. You start with fourteen minutes and every cleared room adds more, so don't wait for stragglers.
    - Old Bess can't be hurt while her valve drones run. When the last one stops she takes double for twelve seconds, so save your big hits for then.
    - In the Pump House, watch the valves light up in order on the west wall. A wrong one resets the sequence.
    - The Cistern floods block by block. Keep moving, and step out of the rings.
    - Throw anything onto the floodgate plates. A dropped item keeps a plate down.
    - Bog Oracles heal their friends. Hit them hard while they channel to stop the heal.
    - The bollards in the Tidewarden's basin are there for a reason. Water doesn't go through stone.
  rooms:
    pump_hall: Old Bess, a pump engine on piston legs. She calls four valve drones and can't be hurt until they stop, then she's open for twelve seconds. Below half, steam vents along the floor. Turn the three valves in the order shown to open the stair.
    cistern: Hold a minute while the water rises, geysers burst and the drowned keep coming.
    pressure_gallery: Chief Engineer Hollis. When a tank's valve starts to go, break it within ten seconds, or the tank bursts, hits the whole party and makes him stronger. It stacks.
    floodgate_control: Sluice Keepers chain and freeze you. Weigh down both plates with counterweights from the supply crate.
    silt_bed: Optional, down the bastion's west tower. Killing the Silt Mother gives the whole party speed and protection for the rest of the run, and she has her own loot. She drags a line of mud through someone, binds two players with roots so they have to stay close, and in the second half wakes the bed ring by ring.
    tidewardens_basin: The Tidewarden, at the foot of the Great Dam. See the boss briefing.
  boss: The Tidewarden throws geysers under people and chains them to her. Her Tidal Wave crosses the whole floor, so get behind a bollard. At two-thirds and one-third she stands in a waterspout and can't be hurt until her witches are dead. In the last third the sluices open and the basin floods.
loot:
  marks: 240
  items: {prismarine_shard: 12, heart_of_the_sea: 1, experience_bottle: 4}
