# The Sunken Aqueduct: a race up the drowned valley, along the Long Span, through the Pump House and the flooded works
# under it, to the foot of the Great Dam. The clock is short, but every room you clear adds time.
# Full reference: docs/EXPEDITIONS.md.
title: The Sunken Aqueduct
description: The old waterworks are flooding and something drowned is turning the valves. Beat the rising water to the Great Dam.
icon: prismarine_bricks
dimension: overworld
sample: sunken_aqueduct
published: true
difficulty: 3
level: 16
party: {min: 1, max: 5}
time-limit-minutes: 14
# Bump when a map changes enough that old best times mean nothing; clears and keys are kept.
records-version: 2
time: 23400
spawn: [0, 64, -22, 0]
exit: [0, 45, 252, 0]
modifiers: []
requires: [thornwood_canopy]
goal: timed
time-bonus-seconds: 150
# The flood is cold and fast, and it's a long swim. The engineers' lines are the only way out of it.
falls: {below: 31, damage: 3, message: "One of Cobb's lines finds you in the flood and hauls you out, half drowned."}

npcs:
  cobb:
    name: Engineer Cobb
    entity: villager
    at: [-4, 64, -20, 0]
    # He offers the daily in content/world-quests.yml, and takes it back at the foot of the dam.
    quests: engineer_cobb
    lines:
      - "The whole works is flooding. You've got fourteen minutes, and every hall you clear buys you a little more."
      - "Old Bess is still running in the Pump House. Nobody's stoking her. When the valve drones are on her she can't be touched, so stop the drones, then hit her with everything while she's wide open."
      - "Under the pumps is the Cistern. When the water comes up, hold on. The pumps need a minute to catch."
      - "The chief engineer went down to the Gallery the night the gates shut. If he's still down there, he isn't himself. When a tank starts to go, break its valve fast."
      - "There's a stair down the west tower of the bastion, to the silt. I wouldn't. Something's been feeding down there, and it's choking the whole line. Clear it and everything downstream runs easier, if you live."
      - "When she calls the tide, get behind the bollards. That water won't go round you."

campfires:
  head_fire: {at: [4, 64, -24], lit: true, title: "Cobb's Camp"}
  bastion_fire: {at: [12, 64, 72], lit: false, title: The Bastion}
  pump_fire: {at: [-22, 64, 139], lit: false, title: The Pump House}
  gallery_fire: {at: [-9, 45, 222], lit: false, title: Floodgate Control}

hazards:
  # The boilers vent along the drains in the Pump House floor.
  steam_lanes:
    type: lane
    area: [-14, 63, 128, 14, 63, 150]
    every: 11
    count: 1
    damage: 5
    burn: 2
    lanes: [[-14, 132, 14, 132], [14, 139, -14, 139], [-14, 146, 14, 146]]
  # Every pulse brings the water up one more block through the Cistern. It drains when the pumps catch.
  cistern_flood: {type: flood, area: [-32, 45, 112, 32, 48, 172], every: 13}
  cistern_geysers: {type: eruption, area: [-30, 44, 114, 30, 44, 170], every: 7, count: 3, damage: 4}
  gallery_rockfall: {type: rocks, area: [-14, 44, 178, 14, 44, 214], every: 8, count: 3, damage: 5}
  basin_geysers: {type: eruption, area: [-24, 44, 252, 24, 44, 300], every: 8, count: 3, damage: 5}
  basin_flood: {type: flood, area: [-28, 45, 249, 28, 46, 304], every: 30}
  silt_fall: {type: rocks, area: [-60, 32, 38, -30, 32, 82], every: 8, count: 3, damage: 5}

ambience:
  - {sound: block.water.ambient, every: 9, volume: 0.6, pitch: 0.7}
  - {sound: block.bubble_column.upwards_ambient, every: 16, volume: 0.5, pitch: 0.7, area: [-34, 42, 110, 34, 62, 174]}
  - {sound: block.piston.extend, every: 7, volume: 0.25, pitch: 0.5, area: [-28, 62, 108, 28, 100, 174]}
  - {sound: block.iron_door.close, every: 19, volume: 0.2, pitch: 0.5, area: [-18, 42, 174, 18, 66, 240]}
  - {sound: weather.rain, every: 12, volume: 0.35, pitch: 0.6, area: [-40, 40, 246, 40, 130, 340]}

# The opening scene, played as the run starts, and the narration after the win.
intro: prologue
outro:
  - "The Great Dam's gates drop home, the flood drains with a long sigh, and under the silt of the basin the stones are scorched black."
  - "Engineer Cobb: 'Scorch marks. Under water. She wasn't mad: something is burning below. The miners at the Gloomforge will know more.'"

cutscenes:
  # The way the water runs, backwards: the span, the pumps, the dam.
  prologue:
    - {at: [0.5, 70, -30, 0, -2], to: [0.5, 74, 6, 0, 0], seconds: 6, title: "<aqua>The Sunken Aqueduct</aqua>", text: "<dark_aqua>Waterworks of the old keep</dark_aqua>", sound: "block.water.ambient", lines: ["|These waterworks carried cold water down from the clouds, to cool the forges beneath Cinder Keep.", "|Engineer Cobb's guild kept them running for three hundred years."]}
    - {at: [48.5, 46, 40, 150, -6], to: [40.5, 46, 58, 170, -8], seconds: 5, fade: true, lines: ["cobb|Then the Tidewarden sealed the floodgates and drowned the valley."]}
    - {at: [0.5, 84, 214, 0, -14], to: [0.5, 92, 236, 0, -18], seconds: 6, fade: true, lines: ["cobb|She says she's drowning a fire. There's no fire down here. Is there?", "|The water is rising, and the clock with it. Every hall you clear buys a little more time."]}
  bess_wakes:
    - {at: [0.5, 72, 122, 0, 6], to: [0.5, 70, 126, 0, 4], seconds: 5, sound: "block.bell.use 0.5", lines: ["|One by one, with nobody at the doors, the boilers of the Pump House light themselves."]}
    - {at: [0.5, 67, 129, 0, -8], to: [0.5, 67, 131, 0, -14], seconds: 4, title: "<gold>Old Bess</gold>", text: "<gray>Number One Engine, in steam for three hundred years</gray>", sound: "entity.iron_golem.repair 0.5", lines: ["|The guild never did decide whether she was a machine."]}
  chief_wakes:
    - {at: [0.5, 53, 180, 0, 4], to: [0.5, 52, 184, 0, 2], seconds: 5, title: "<dark_aqua>Chief Engineer Hollis</dark_aqua>", text: "<gray>He stayed at his post</gray>", sound: "block.iron_door.close 0.6", lines: ["Chief Engineer Hollis|Pressure's up. Pressure's holding. All hands. All hands to the valves.", "cobb|Hollis? Oh, no. Not you."]}
  silt_wakes:
    - {at: [-31, 42, 60, 90, 8], to: [-35, 40, 60, 90, 6], seconds: 5, title: "<dark_green>The Silt Mother</dark_green>", text: "<gray>Three hundred years of what came down the drains</gray>", sound: "entity.warden.dig 0.6", lines: ["|The mud breathes in."]}
  basin:
    - {at: [0.5, 52, 256, 0, -24], to: [0.5, 52, 262, 0, -34], seconds: 5, sound: "entity.elder_guardian.curse 0.6", lines: ["|Water stops running down the bronze of her statue. All of it, all at once."]}
    - {at: [0.5, 60, 262, 0, 18], to: [0.5, 56, 268, 0, 6], seconds: 6, lines: ["|Behind the basin, the moat stands up."]}
    - {at: [10, 57, 262, -20, -8], to: [9, 56, 264, -20, -12], seconds: 4, title: "<dark_aqua>The Tidewarden</dark_aqua>", text: "<gray>Keeper of the floodgates, drowning a fire only she can feel</gray>", sound: "entity.elder_guardian.ambient 0.8", lines: ["The Tidewarden|Open the gates and let the embers breathe? Then you drown with them!"]}

