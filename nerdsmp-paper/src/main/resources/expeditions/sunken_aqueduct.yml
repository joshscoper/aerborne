# The Sunken Aqueduct: a race through flooded waterworks. The clock is short, but every room you
# clear adds time. Full reference: docs/EXPEDITIONS.md.
title: The Sunken Aqueduct
description: The old waterworks are flooding and something drowned is turning the valves. Beat the rising water.
icon: prismarine_bricks
dimension: overworld
sample: sunken_aqueduct
published: true
difficulty: 3
level: 16
party: {min: 1, max: 5}
time-limit-minutes: 10
spawn: [0, 64, 4, 0]
exit: [0, 64, 121]
modifiers: []
requires: [thornwood_canopy]
goal: timed
time-bonus-seconds: 120

npcs:
  brann:
    name: Engineer Brann
    entity: villager
    at: [-3, 64, 9, 90]
    lines:
      - "The whole works is flooding. You've got ten minutes, and every hall you clear buys you two more."
      - "The sluice valves have to be turned in the right order. Watch the hall: the old mechanism lights them up."
      - "The floodgates take counterweights. Throw anything heavy on the plates: blocks, tools, your lunch."
      - "Whatever's down in the basin, it's been turning the valves. Drowned, but clever."

campfires:
  intake_fire: {at: [4, 64, 8], lit: true, title: Intake Fire}
  pumphouse_stove: {at: [3, 64, 92], lit: false, title: Pumphouse Stove}

setpieces:
  sluice_water: {box: [4, 63, 14, 7, 63, 40], block: air, style: crumble}

hazards:
  cistern_geysers: {type: eruption, area: [-9, 63, 44, 9, 63, 64], every: 6, count: 3, damage: 4}
  basin_geysers: {type: eruption, area: [-9, 63, 100, 9, 63, 118], every: 7, count: 3, damage: 5}

# The opening scene, played as the run starts, and the narration after the win.
intro: prologue
outro:
  - "The basin drains with a long sigh. Under the silt, the stones are scorched black."
  - "Engineer Brann: 'Scorch marks. Under water. She wasn't mad: something is burning below. The miners at the Gloomforge will know more.'"

cutscenes:
  prologue:
    - {at: [0.5, 67, 2, 0, 5], seconds: 5, title: "<aqua>The Sunken Aqueduct</aqua>", text: "<dark_aqua>Waterworks of the old keep</dark_aqua>", sound: "block.water.ambient", lines: ["|These waterworks carried cold water down to cool the forges beneath Cinder Keep.", "|Engineer Brann's guild kept them running for three hundred years."]}
    - {at: [0.5, 68, 47, 0, 10], seconds: 5, fade: true, lines: ["brann|Then the Tidewarden sealed the floodgates and drowned the lower halls.", "brann|She says she's drowning a fire. There's no fire down here. Is there?"]}
    - {at: [0.5, 67, 70, 0, 10], seconds: 4, lines: ["|The water is rising, and the clock with it. Every hall you clear buys a little more time."]}
  basin:
    - {at: [0.5, 71, 99, 0, 28], seconds: 3, text: "<aqua>The Tidewarden's Basin</aqua>", sound: "block.water.ambient", lines: ["|The water stills. Something vast moves beneath it."]}
    - {at: [0.5, 67, 104, 0, 10], seconds: 4, title: "<dark_aqua>The Tidewarden</dark_aqua>", text: "<gray>Keeper of the floodgates, drowning a fire only she can feel</gray>", sound: "entity.elder_guardian.curse 0.8", lines: ["The Tidewarden|Open the gates and let the embers breathe? Then you drown with them!"]}

mobs:
  "custom:bog_oracle": {role: elite, abilities: [mend, poison_cloud]}
  "custom:sluicehand": {role: normal}
  "custom:sluice_keeper": {role: elite, abilities: [tether, frost_nova]}

# Loot containers: every player loots each once with their own roll. Secrets count toward the score.
chests:
  sluice_crate: {at: [6, 64, 16], kind: crate, title: Sluice Crate}
  cistern_strongbox: {at: [-9, 64, 64], kind: chest, title: Cistern Strongbox}
  drowned_lockbox: {at: [8, 64, 86], kind: secret, title: Drowned Lockbox}

# Where the reward chests appear when the run is won.
reward-chests:
  free: [-2, 64, 120]
  bonus: [2, 64, 120]

rooms:
  sluice_hall:
    title: The Sluice Hall
    region: [-8, 64, 14, 8, 70, 40]
    checkpoint: [0, 64, 38, 0]
    gate: [-1, 64, 41, 1, 66, 41]
    points: [[-5, 64, 18], [0, 64, 22], [-5, 64, 30], [0, 64, 35], [-3, 64, 26]]
    puzzles:
      valves:
        type: sequence
        title: Turn the valves in order
        blocks: [[-8, 65, 19], [-8, 65, 25], [-8, 65, 31]]
        order: [2, 3, 1]
        show: true
    encounter:
      type: waves
      waves:
        - {"custom:sluicehand": 3, "custom:bog_oracle": 1}
        - {mobs: {"custom:sluicehand": 2, "custom:sluice_keeper": 1}, delay-seconds: 4}
      scripts:
        start: ["say brann|Valves are on the west wall. Watch for the lights, then turn them in that order!"]
        solved-valves: ["break sluice_water", "message <aqua>The channel drains with a roar.</aqua>"]
        clear: ["say brann|Sluice is open. Two more minutes on the clock!"]
  cistern:
    title: The Cistern
    region: [-10, 64, 43, 10, 72, 65]
    checkpoint: [0, 64, 63, 0]
    gate: [-1, 64, 66, 1, 66, 66]
    points: [[-8, 64, 46], [8, 64, 46], [-8, 64, 62], [8, 64, 62], [0, 64, 54]]
    encounter:
      type: survive
      survive-seconds: 50
      waves:
        - {"custom:sluicehand": 3}
        - {mobs: {"custom:bog_oracle": 1, "custom:sluicehand": 2}, delay-seconds: 10}
      scripts:
        start: ["title <aqua>Hold the cistern|<gray>The pumps need fifty seconds</gray>", "hazard start cistern_geysers"]
        timer-35: ["message <yellow>Fifteen seconds! The pumps are catching!</yellow>"]
        clear: ["hazard stop cistern_geysers"]
  floodgate_control:
    title: Floodgate Control
    region: [-9, 64, 68, 9, 70, 88]
    checkpoint: [0, 64, 86, 0]
    gate: [-1, 64, 89, 1, 66, 89]
    points: [[-6, 64, 71], [6, 64, 71], [-5, 64, 84], [5, 64, 84], [0, 64, 78]]
    puzzles:
      counterweights:
        type: plates
        title: Weigh down both floodgate plates
        blocks: [[-6, 65, 75], [6, 65, 75]]
        supply: [3, 64, 71]
    encounter:
      type: clear
      waves:
        - {"custom:sluice_keeper": 2, "custom:bog_oracle": 1, "custom:sluicehand": 2}
      scripts:
        start: ["say brann|Throw anything on those plates. Both of them have to stay down!"]
        clear: ["say brann|The floodgate's up! Stoke the pumphouse stove; the basin's right after."]
  tidewardens_basin:
    title: The Tidewarden's Basin
    region: [-12, 64, 97, 12, 74, 122]
    points: [[0, 64, 110], [-7, 64, 103], [7, 64, 103], [-7, 64, 116], [7, 64, 116]]
    encounter:
      type: boss
      boss: custom:tidewarden
      boss-level-bonus: 3
      abilities: [tether, frost_nova]
      phases:
        - {at: 50, abilities: [tether, meteor, summon], title: "The tide turns"}
      enrage-seconds: 240
      adds-at-health: [70, 35]
      waves:
        - {"custom:sluicehand": 3}
        - {"custom:sluice_keeper": 1, "custom:sluicehand": 2}
      scripts:
        start:
          - "cutscene basin"
          - "wait 7"
          - "say The Tidewarden|The water was here first. It will be here last."
        health-50: ["hazard start basin_geysers", "say The Tidewarden|Rise!"]
        clear: ["hazard stop basin_geysers", "say brann|The water's going down! Out through the back, quick."]

guide:
  lore: "The aqueduct was built to carry cold water down from the clouds to the forges beneath Cinder Keep, cooling the stone that holds Pyrrhax asleep. Engineer Brann's guild has kept it running for three centuries. When the Tidewarden, the aqueduct's ancient keeper, felt the deep stone warming, she sealed the floodgates and drowned the lower halls to smother the heat. Brann thinks she has gone mad. The truth is worse."
  overview: A timed run through flooding waterworks. You start with ten minutes and each cleared room adds two. Turn the valves, hold the cistern, weigh down the floodgates and face the Tidewarden.
  tips:
    - The clock is the danger. Don't wait for stragglers; push room to room.
    - Watch the Sluice Hall when you enter. The valves light up in the order to turn them; a wrong one resets the sequence.
    - Floodgate plates need weight. Throw blocks or spare items onto them; a dropped item keeps a plate down.
    - Bog Oracles heal their friends. Hit them hard while they channel to interrupt the heal.
  rooms:
    sluice_hall: Drowned and a Bog Oracle, then a Sluice Keeper. Turn the three valves in the order shown.
    cistern: Survive fifty seconds while geysers burst from the floor; step out of the orange rings.
    floodgate_control: Sluice Keepers chain and freeze you. Weigh down both plates with counterweights from the supply crate.
    tidewardens_basin: The Tidewarden, a moat of water and geysers in the second half.
  boss: The Tidewarden chains players to it and freezes anyone close. At two-thirds and one-third health drowned pour in. Below half it drops a crushing wave on one player (share it with them to split the damage), calls helpers, and geysers burst from the floor.
loot:
  marks: 220
  items: {prismarine_shard: 12, heart_of_the_sea: 1, experience_bottle: 4}
