config-version = "2.7"
bind = "0.0.0.0:25565"
motd = "<gradient:#77C8F5:#8CE8ED><bold>AERBORNE</bold></gradient> <#8E9AAF>»</#8E9AAF> <#F4F9FF>A Skyblock RPG Adventure</#F4F9FF>\n<#8E9AAF>Build your island. Explore the skies. Discover magic.</#8E9AAF>"
show-max-players = 30
online-mode = true
force-key-authentication = true
prevent-client-proxy-connections = false
player-info-forwarding-mode = "modern"
forwarding-secret-file = "forwarding.secret"
announce-forge = false
kick-existing-players = false
ping-passthrough = "MODS"
enable-player-address-logging = false

[servers]
smp = "paper:25566"
try = ["smp"]

[forced-hosts]

[advanced]
compression-threshold = 256
compression-level = -1
login-ratelimit = 3000
connection-timeout = 5000
read-timeout = 30000
haproxy-protocol = false
tcp-fast-open = true
bungee-plugin-message-channel = true
show-ping-requests = false
failover-on-unexpected-server-disconnect = true
announce-proxy-commands = true
log-command-executions = false
log-player-connections = false

[query]
enabled = false

